<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Clash Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root {
  --bg: #121826;
  --panel: #1f2a44;
  --panel-2: #2a3a5e;
  --text: #f3f6ff;
  --muted: #9fb0d6;
  --gold: #ffd34d;
  --blue: #2f7bf5;
  --red: #e8433a;
  --elixir: #d63bd6;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  cursor: default;
}

.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, rgba(18, 24, 38, 0.82), rgba(8, 10, 18, 0.95));
  z-index: 10;
  overflow-y: auto;
  padding: 16px;
}

.overlay.hidden { display: none; }

.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 3px solid #0d1426;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.08);
  padding: 20px 24px;
  max-width: 760px;
  width: 100%;
  margin: auto;
}

.logo {
  margin: 0;
  text-align: center;
  font-size: 44px;
  letter-spacing: 1px;
  color: var(--gold);
  text-shadow: 0 3px 0 #9a6b00, 0 6px 12px rgba(0, 0, 0, 0.6);
}
.logo span { color: #fff; text-shadow: 0 3px 0 #1d4fa8, 0 6px 12px rgba(0, 0, 0, 0.6); }

.subtitle { text-align: center; margin: 4px 0 12px; color: var(--muted); }

h2 { font-size: 17px; margin: 14px 0 8px; }
.muted { color: var(--muted); font-weight: normal; font-size: 13px; }

.card-row, .card-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
}
.card-row { min-height: 90px; background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 6px; }

.card-slot {
  position: relative;
  cursor: pointer;
  border-radius: 8px;
  transition: transform 0.08s;
}
.card-slot canvas { width: 100%; display: block; }
.card-slot:hover { transform: translateY(-3px); }
.card-slot.in-deck canvas { opacity: 0.35; }
.card-slot.in-deck::after {
  content: "✓";
  position: absolute;
  top: 38%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 26px;
  color: #7dff9a;
  text-shadow: 0 2px 3px #000;
}
.card-slot.empty {
  aspect-ratio: 3.3 / 4.3;
  border: 2px dashed rgba(255, 255, 255, 0.18);
  cursor: default;
}

.card-info {
  margin-top: 8px;
  min-height: 42px;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--muted);
}
.card-info b { color: var(--text); }

.segmented { display: flex; gap: 6px; }
.segmented button {
  flex: 1;
  padding: 9px;
  border-radius: 10px;
  border: 2px solid #0d1426;
  background: #33456f;
  color: var(--text);
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}
.segmented button.active { background: var(--blue); box-shadow: inset 0 -3px 0 #1d4fa8; }

.big-btn {
  display: block;
  margin: 16px auto 4px;
  padding: 12px 40px;
  font: inherit;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(180deg, #ffcd3c, #f29d0b);
  border: 3px solid #7a4a00;
  border-radius: 14px;
  box-shadow: 0 5px 0 #7a4a00;
  text-shadow: 0 2px 0 #7a4a00;
  cursor: pointer;
}
.big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a4a00; }
.big-btn:disabled { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }
.big-btn.secondary {
  background: linear-gradient(180deg, #5c8cf5, #2f5fcf);
  border-color: #13306e;
  box-shadow: 0 5px 0 #13306e;
  text-shadow: 0 2px 0 #13306e;
}

.hint { text-align: center; font-size: 13px; color: var(--muted); margin: 6px 0 0; }
#conn-status { text-align: center; margin: 4px 0 0; }

.end-panel { max-width: 440px; text-align: center; }
#end-title { font-size: 46px; margin: 4px 0; }
#end-title.win { color: var(--gold); text-shadow: 0 3px 0 #9a6b00; }
#end-title.lose { color: #ff7b72; text-shadow: 0 3px 0 #7a1712; }
#end-title.draw { color: #d6e0ff; text-shadow: 0 3px 0 #3a4a70; }
.end-crowns { font-size: 30px; margin: 6px 0; }
.end-crowns .blue { color: #8fc1ff; }
.end-crowns .red { color: #ff9d95; }
.end-stats { margin: 10px auto; border-collapse: collapse; font-size: 14px; }
.end-stats td, .end-stats th { padding: 4px 12px; }
.end-stats th { color: var(--muted); font-weight: normal; }
.end-stats td:nth-child(2) { color: #8fc1ff; }
.end-stats td:nth-child(3) { color: #ff9d95; }
.end-buttons { display: flex; gap: 12px; justify-content: center; }
.end-buttons .big-btn { margin: 12px 0 0; padding: 10px 26px; font-size: 19px; }

.icon-btn {
  position: fixed;
  left: 6px;
  top: 88px;
  z-index: 20;
  width: 38px;
  height: 38px;
  opacity: 0.85;
  border-radius: 50%;
  border: 2px solid #0d1426;
  background: rgba(31, 42, 68, 0.85);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

.icon-btn.left { top: 44px; }
.icon-btn.hidden { display: none; }

@media (max-width: 640px) {
  .card-row, .card-grid { grid-template-columns: repeat(4, 1fr); }
  .logo { font-size: 34px; }
  .panel { padding: 14px 12px; }
}

/* ------------------------------------------------------------------ home layout */

#home {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: radial-gradient(ellipse at top, var(--sky, #22315a), #0b101c 75%);
}
#home.hidden, .hidden { display: none !important; }

#topbar, #tab-content, #bottomnav { width: 100%; max-width: 580px; }

#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: linear-gradient(180deg, rgba(10, 16, 34, 0.95), rgba(10, 16, 34, 0.7));
  border-bottom: 2px solid #0d1426;
}
.player-chip { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.level-badge {
  position: relative;
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  font-weight: bold;
  font-size: 17px;
  color: #fff;
  text-shadow: 0 2px 0 #13306e;
  background: conic-gradient(#7fd1ff var(--xp, 0%), #22305a 0);
  border-radius: 50%;
}
.level-badge::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: linear-gradient(180deg, #5c8cf5, #2f5fcf);
  z-index: 0;
}
.level-badge span { position: relative; z-index: 1; }
.player-name { font-weight: bold; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.res-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px 3px 4px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  white-space: nowrap;
}

.ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.ico.big { width: 56px; height: 56px; }
.ico.md { width: 28px; height: 28px; }
.amount { display: inline-flex; align-items: center; gap: 4px; }
.amount b { font-size: inherit; }

#tab-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 12px 20px;
  scrollbar-width: thin;
}

#bottomnav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: linear-gradient(180deg, #1f2a44, #121a2e);
  border-top: 2px solid #0d1426;
}
.nav-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 7px 2px 9px;
  background: none;
  border: none;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.15s;
}
.nav-btn .ico { width: 30px; height: 30px; transition: transform 0.15s; }
.nav-btn.active { color: #fff; background: linear-gradient(180deg, #33466f, #26365a); }
.nav-btn.active .ico { transform: scale(1.18) translateY(-2px); }
.badge-dot {
  position: absolute;
  top: 4px;
  right: calc(50% - 22px);
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 9px;
  background: #e8433a;
  border: 2px solid #fff;
  color: #fff;
  font-size: 11px;
  line-height: 14px;
  text-align: center;
}

/* ------------------------------------------------------------------ generic blocks */

.section { margin-bottom: 16px; }
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 6px 2px 8px;
  font-size: 16px;
  font-weight: bold;
}
.section-title .muted { font-size: 12px; }
.box {
  background: linear-gradient(180deg, rgba(42, 58, 94, 0.95), rgba(31, 42, 68, 0.95));
  border: 2px solid #0d1426;
  border-radius: 14px;
  padding: 10px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.06);
}
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.small { font-size: 12px; }
.gold-text { color: var(--gold); }
.green-text { color: #7dff9a; }
.red-text { color: #ff7b72; }
.error-text { color: #ff7b72; min-height: 18px; text-align: center; margin: 6px 0 0; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 14px;
  font: inherit;
  font-size: 14px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(180deg, #5c8cf5, #2f5fcf);
  border: 2px solid #13306e;
  border-radius: 10px;
  box-shadow: 0 3px 0 #13306e;
  text-shadow: 0 1px 0 #13306e;
  cursor: pointer;
  white-space: nowrap;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #13306e; }
.btn:disabled { filter: grayscale(1) brightness(0.8); cursor: not-allowed; }
.btn.yellow { background: linear-gradient(180deg, #ffcd3c, #f29d0b); border-color: #7a4a00; box-shadow: 0 3px 0 #7a4a00; text-shadow: 0 1px 0 #7a4a00; }
.btn.green { background: linear-gradient(180deg, #5ee08a, #1fa352); border-color: #0d5a2a; box-shadow: 0 3px 0 #0d5a2a; text-shadow: 0 1px 0 #0d5a2a; }
.btn.red { background: linear-gradient(180deg, #ff7b72, #d0342b); border-color: #6a1510; box-shadow: 0 3px 0 #6a1510; text-shadow: 0 1px 0 #6a1510; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.block { width: 100%; }

.progress {
  position: relative;
  height: 16px;
  border-radius: 8px;
  background: #0d1426;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.progress > i {
  position: absolute;
  inset: 0 auto 0 0;
  background: linear-gradient(180deg, #6cb8ff, #2f7bf5);
  border-radius: 8px;
}
.progress.full > i { background: linear-gradient(180deg, #6ff09a, #1fa352); }
.progress.gold > i { background: linear-gradient(180deg, #ffe066, #f29d0b); }
.progress > span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: bold;
  text-shadow: 0 1px 1px #000;
}

input, textarea, select {
  font: inherit;
  color: #fff;
  background: #0f1830;
  border: 2px solid #2d3f66;
  border-radius: 10px;
  padding: 8px 10px;
  outline: none;
}
input:focus, textarea:focus, select:focus { border-color: #5c8cf5; }

.card-canvas { width: 100%; display: block; }
.chest-canvas { display: block; }

/* ------------------------------------------------------------------ battle tab */

.arena-banner { position: relative; text-align: center; padding: 10px; overflow: hidden; }
.arena-banner canvas { width: 100%; max-width: 250px; border-radius: 10px; border: 3px solid rgba(0, 0, 0, 0.45); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); }
.arena-num { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.arena-name { font-size: 22px; font-weight: bold; color: var(--gold); text-shadow: 0 2px 0 #7a4a00; margin: 2px 0 8px; }
.trophy-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.trophy-line .progress { flex: 1; }

.battle-buttons { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 14px 0; }
.battle-btn {
  width: 78%;
  padding: 14px;
  font: inherit;
  font-size: 26px;
  font-weight: bold;
  color: #fff;
  letter-spacing: 1px;
  background: linear-gradient(180deg, #ffd34d, #f29d0b);
  border: 3px solid #7a4a00;
  border-radius: 16px;
  box-shadow: 0 6px 0 #7a4a00, 0 10px 20px rgba(0, 0, 0, 0.4);
  text-shadow: 0 2px 0 #7a4a00;
  cursor: pointer;
  animation: pulse 2s infinite;
}
.battle-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a4a00; }
@keyframes pulse { 50% { transform: scale(1.03); } }

.deck-mini { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.deck-mini .card-canvas { border-radius: 5px; }
.deck-tabs { display: flex; gap: 4px; }
.deck-tab {
  padding: 3px 10px;
  border-radius: 8px;
  border: 2px solid #0d1426;
  background: #33456f;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}
.deck-tab.active { background: var(--blue); color: #fff; }

.chest-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chest-slot {
  position: relative;
  min-height: 118px;
  border-radius: 12px;
  border: 2px solid #0d1426;
  background: linear-gradient(180deg, #33456f, #22304f);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 4px 3px 6px;
  cursor: pointer;
  text-align: center;
  font-size: 11px;
  font-weight: bold;
}
.chest-slot.empty { background: rgba(0, 0, 0, 0.25); border-style: dashed; border-color: rgba(255, 255, 255, 0.12); cursor: default; color: var(--muted); justify-content: center; }
.chest-slot.ready { background: linear-gradient(180deg, #4ab86a, #267a3e); animation: glowGreen 1.4s infinite; }
.chest-slot.unlocking { background: linear-gradient(180deg, #3f5f9a, #2a4270); }
.chest-slot canvas { width: 88%; }
.chest-slot .chest-label { margin-top: 2px; line-height: 1.2; }
.chest-slot .arena-tag { position: absolute; top: 3px; left: 4px; font-size: 9px; color: rgba(255, 255, 255, 0.6); }
@keyframes glowGreen { 50% { box-shadow: 0 0 14px rgba(110, 255, 150, 0.8); } }

.bonus-chests { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.bonus-chest { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; }
.bonus-chest canvas { width: 58px; flex: none; }
.bonus-chest.ready { animation: glowGreen 1.4s infinite; }

/* ------------------------------------------------------------------ cards tab */

.card-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.coll-card { position: relative; cursor: pointer; transition: transform 0.08s; }
.coll-card:hover { transform: translateY(-2px); }
.coll-card .progress { height: 13px; margin-top: 3px; }
.coll-card .progress > span { font-size: 10px; }
.coll-card .up-arrow {
  position: absolute;
  top: -6px;
  right: -4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #1fa352;
  border: 2px solid #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: bold;
  animation: bounce 1s infinite;
}
.coll-card.in-deck::after {
  content: "";
  position: absolute;
  inset: -3px -3px 13px;
  border: 3px solid var(--gold);
  border-radius: 9px;
  pointer-events: none;
}
.coll-card.locked { opacity: 0.65; cursor: default; }
.coll-card .locked-tag { font-size: 10px; text-align: center; color: var(--muted); margin-top: 2px; }
.coll-card.swap-target { animation: shake 0.5s infinite; }
@keyframes bounce { 50% { transform: translateY(-3px); } }
@keyframes shake { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
.swap-banner { position: sticky; top: -12px; z-index: 2; margin: -12px -12px 10px; padding: 10px; background: #f29d0b; color: #fff; font-weight: bold; text-align: center; text-shadow: 0 1px 0 #7a4a00; }

.card-detail { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; }
.stat-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.stat-table td { padding: 4px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.stat-table td:first-child { color: var(--muted); }
.stat-table .up { color: #7dff9a; font-size: 11px; }
.rarity-tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
.rarity-common { background: #5d7394; }
.rarity-rare { background: #b86a12; }
.rarity-epic { background: #7a2fb0; }
.rarity-legendary { background: linear-gradient(90deg, #d8b24a, #3a6ad8); }

/* ------------------------------------------------------------------ shop */

.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.offer {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 6px;
  text-align: center;
  font-size: 12px;
}
.offer .card-canvas { width: 72%; }
.offer .qty { font-weight: bold; font-size: 15px; }
.offer.sold { opacity: 0.45; }
.offer .free-tag { position: absolute; top: -6px; left: -4px; background: #1fa352; padding: 1px 6px; border-radius: 6px; font-size: 11px; font-weight: bold; transform: rotate(-8deg); }
.offer canvas.chest-canvas { width: 80px; }

/* ------------------------------------------------------------------ pass */

.pass-head { display: flex; align-items: center; gap: 10px; }
.tier-badge {
  width: 52px;
  height: 52px;
  flex: none;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(180deg, #ffcd3c, #f29d0b);
  border: 3px solid #7a4a00;
  text-shadow: 0 2px 0 #7a4a00;
}
.quest { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px; }
.quest .grow .progress { margin-top: 4px; }
.quest.done { box-shadow: 0 0 0 2px #3ee07a inset; }
.tiers { display: flex; flex-direction: column; gap: 6px; }
.tier-row { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 6px; align-items: stretch; }
.tier-num {
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-weight: bold;
  background: #22304f;
  border: 2px solid #0d1426;
}
.tier-row.reached .tier-num { background: linear-gradient(180deg, #ffcd3c, #f29d0b); text-shadow: 0 1px 0 #7a4a00; }
.reward-tile {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  min-height: 52px;
  border-radius: 10px;
  border: 2px solid #0d1426;
  background: #2a3a5e;
  font-size: 12px;
  font-weight: bold;
}
.reward-tile.premium { background: linear-gradient(180deg, #5a3a8a, #3a2460); }
.reward-tile.claimable { box-shadow: 0 0 0 2px #3ee07a inset; cursor: pointer; animation: glowGreen 1.4s infinite; }
.reward-tile.claimed { opacity: 0.45; }
.reward-tile.locked { opacity: 0.7; }
.reward-tile canvas.chest-canvas { width: 44px; }
.reward-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; }
.reward-icon .ico { width: 30px; height: 30px; }

/* ------------------------------------------------------------------ trophy road */

.road { display: flex; flex-direction: column-reverse; gap: 8px; padding: 6px 0; }
.road-step { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; }
.road-trophies { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-weight: bold; font-size: 13px; }
.road-step.reached .road-trophies { color: var(--gold); }
.road-arena {

    const lanes = new Set();
    for (const lane of ['left', 'right']) {
      const t = this.getTower(1 - team, lane);
      if (!t || !t.alive) lanes.add(lane);
    }
    return lanes;
  }

  obstacles() {
    return this.entities.filter((e) => e.alive && e.isBuilding);
  }

  canDeployAt(team, cardId, x, y) {
    const card = CARDS[cardId];
    if (!card || card.token) return false;
    const anywhere = !!(card.unit && card.unit.anywhere);
    return arena.canDeploy(team, card.type, x, y, this.destroyedEnemyLanes(team), this.obstacles(), anywhere);
  }

  levelOf(team, cardId) {
    const map = this.levels[team];
    return clampLevel(map && map[cardId]);
  }

  // ---------------------------------------------------------------- spawning

  spawnTower(team, layout) {
    const s = TOWERS[layout.kind];
    const lvl = this.towerLevels[team];
    const t = {
      id: this.nextId++,
      kind: 'tower',
      card: layout.kind,
      towerKind: layout.kind,
      lane: layout.lane,
      team,
      x: layout.x,
      y: layout.y,
      radius: s.radius,
      level: lvl,
      hp: scale(s.hp, lvl),
      maxHp: scale(s.hp, lvl),
      damage: scale(s.damage, lvl),
      hitSpeed: s.hitSpeed,
      firstHit: 0.3,
      range: s.range,
      targets: 'both',
      projectile: { speed: s.projectileSpeed, kind: layout.kind === 'king' ? 'cannonball' : 'arrow' },
      splash: 0,
      splashSelf: 0,
      flying: false,
      isBuilding: true,
      mass: Infinity,
      speed: 0,
      active: layout.kind !== 'king',
      alive: true,
      target: null,
      atkTimer: 0.3,
      stunTimer: 0,
      deployTimer: 0,
    };
    this.entities.push(t);
    return t;
  }

  spawnUnit(team, cardId, x, y, deployTime = UNIT.deployTime, level = null) {
    const card = CARDS[cardId];
    const u = card.unit;
    const isBuilding = card.type === 'building';
    const lvl = level != null ? clampLevel(level) : this.levelOf(team, cardId);
    const m = statMult(lvl);
    const e = {
      id: this.nextId++,
      kind: isBuilding ? 'building' : 'unit',
      card: cardId,
      team,
      x,
      y,
      radius: u.radius,
      level: lvl,
      hp: Math.round(u.hp * m),
      maxHp: Math.round(u.hp * m),
      damage: Math.round(u.damage * m),
      hitSpeed: u.hitSpeed,
      firstHit: u.firstHit,
      range: u.range,
      sight: u.targets === 'buildings' ? BUILDING_SIGHT : Math.max(UNIT.sightRange, u.range + 0.5),
      speed: u.speed,
      targets: u.targets,
      flying: u.flying,
      splash: u.splash,
      splashSelf: u.splashSelf,
      projectile: u.projectile,
      deathDamage: u.deathDamage ? { damage: Math.round(u.deathDamage.damage * m), radius: u.deathDamage.radius } : null,
      deathSpawn: u.deathSpawn || null,
      spawn: u.spawn || null,
      spawnTimer: u.spawn ? u.spawn.first : 0,
      charge: u.charge || null,
      chargeDist: 0,
      charging: false,
      ramp: u.ramp ? { min: u.ramp.min * m, max: u.ramp.max * m, time: u.ramp.time } : null,
      rampTime: 0,
      rampTarget: null,
      towerDamagePct: u.towerDamagePct || 1,
      jumpsRiver: !!u.jumpsRiver,
      mass: u.mass,
      lifetime: u.lifetime || 0,
      isBuilding,
      alive: true,
      active: true,
      target: null,
      atkTimer: u.firstHit,
      retargetTimer: 0,
      deployTimer: deployTime,
      stunTimer: 0,
      facing: team === 0 ? -Math.PI / 2 : Math.PI / 2,
      moving: false,
      attacking: false,
      lastX: x,
      lastY: y,
      stuckTime: 0,
    };
    this.entities.push(e);
    return e;
  }

  // ---------------------------------------------------------------- actions

  /**
   * Play the card in hand `slot` at world position (x, y).
   * Returns { ok: true, card } or { ok: false, reason }.
   */
  play(team, slot, x, y) {
    if (this.phase !== 'regular' && this.phase !== 'overtime') return { ok: false, reason: 'not-running' };
    const p = this.players[team];
    if (!Number.isInteger(slot) || slot < 0 || slot >= p.hand.length) return { ok: false, reason: 'bad-slot' };
    const cardId = p.hand[slot];
    const card = CARDS[cardId];
    if (!p.canAfford(slot)) return { ok: false, reason: 'elixir' };
    if (!this.canDeployAt(team, cardId, x, y)) return { ok: false, reason: 'zone' };
    p.consume(slot);
    this.stats.played[team][cardId] = (this.stats.played[team][cardId] || 0) + 1;
    this.deployCard(team, cardId, x, y);
    return { ok: true, card: cardId };
  }

  deployCard(team, cardId, x, y) {
    const card = CARDS[cardId];
    const level = this.levelOf(team, cardId);
    this.events.push({ e: 'deploy', card: cardId, team, x, y });
    if (card.type === 'spell') {
      const s = card.spell;
      if (s.travelSpeed) {
        const king = this.getTower(team, 'center');
        this.projectiles.push({
          id: this.nextId++, team, kind: cardId, spell: cardId, source: cardId, level,
          x: king.x, y: king.y, sx: king.x, sy: king.y, tx: x, ty: y,
          targetId: null, speed: s.travelSpeed, damage: s.damage, splash: 0,
        });
      } else {
        this.applySpell(team, cardId, x, y, level);
      }
      return;
    }
    if (card.unit.anywhere) {
      // The Miner digs a tunnel from the king tower and pops out at the target spot.
      const king = this.getTower(team, 'center');
      this.projectiles.push({
        id: this.nextId++, team, kind: 'tunnel', tunnel: cardId, source: cardId, level,
        x: king.x, y: king.y, sx: king.x, sy: king.y, tx: x, ty: y, targetId: null, speed: 6.5, damage: 0, splash: 0,
      });
      return;
    }
    const flip = team === 0 ? 1 : -1;
    for (const [ox, oy] of card.formation) {
      const e = this.spawnUnit(team, cardId, x + ox, y + oy * flip);
      e.x = Math.min(ARENA.width - e.radius, Math.max(e.radius, e.x));
      e.y = Math.min(ARENA.height - e.radius, Math.max(e.radius, e.y));
      if (!e.flying) arena.clampToLand(e);
    }
  }

  applySpell(team, cardId, x, y, level = 1) {
    const s = CARDS[cardId].spell;
    const damage = scale(s.damage, level);
    this.events.push({ e: 'spell', card: cardId, team, x, y, r: s.radius });
    for (const e of this.entities) {
      if (!e.alive || e.team === team) continue;
      const d = Math.hypot(e.x - x, e.y - y);
      if (d - e.radius > s.radius) continue;
      const dmg = e.kind === 'tower' ? Math.round(damage * s.towerDamagePct) : damage;
      this.dealDamage(e, dmg, team, cardId);
      if (s.stun && e.alive && e.kind === 'building') this.stun(e, s.stun);
      if (!e.isBuilding && e.alive) {
        if (s.stun) this.stun(e, s.stun);
        if (s.knockback && e.mass <= 10) {
          const k = s.knockback * Math.min(1, 4 / e.mass);
          const nx = d > 0.01 ? (e.x - x) / d : 0;
          const ny = d > 0.01 ? (e.y - y) / d : (e.team === 0 ? 1 : -1);
          e.x += nx * k;
          e.y += ny * k;
          this.keepInBounds(e);
        }
      }
    }
  }

  /** Stun resets attack wind-up, charges and ramping beams. */
  stun(e, duration) {
    e.stunTimer = Math.max(e.stunTimer, duration);
    e.atkTimer = Math.max(e.atkTimer, e.firstHit);
    e.chargeDist = 0;
    e.charging = false;
    e.rampTime = 0;
  }

  // ---------------------------------------------------------------- damage

  dealDamage(target, amount, fromTeam, sourceCard) {
    if (!target.alive || amount <= 0) return;
    target.hp -= amount;
    const dealt = Math.min(amount, amount + Math.min(0, target.hp));
    if (sourceCard) {
      const d = this.stats.damageByCard[fromTeam];
      d[sourceCard] = (d[sourceCard] || 0) + dealt;
    }
    if (target.kind === 'tower') {
      this.stats.towerDamage[fromTeam] += dealt;
      const key = sourceCard || 'tower';
      this.stats.towerDamageByCard[fromTeam][key] = (this.stats.towerDamageByCard[fromTeam][key] || 0) + dealt;
      if (target.towerKind === 'king') target.active = true;
    }
    this.events.push({ e: 'hit', id: target.id, x: target.x, y: target.y, d: Math.round(amount), tower: target.kind === 'tower' });
    if (target.hp <= 0) {
      target.hp = 0;
      target.alive = false;
    }
  }

  splashDamage(team, x, y, radius, damage, filter, sourceCard, towerPct = 1) {
    for (const e of this.entities) {
      if (!e.alive || e.team === team) continue;
      if (!this.matchesFilter(filter, e)) continue;
      if (Math.hypot(e.x - x, e.y - y) - e.radius > radius) continue;
      this.dealDamage(e, e.kind === 'tower' ? Math.round(damage * towerPct) : damage, team, sourceCard);
    }
  }

  /** Can an attacker with target-type `targets` hit entity `e`? */
  matchesFilter(targets, e) {
    if (targets === 'buildings') return e.isBuilding;
    if (targets === 'ground') return !e.flying;
    return true;
  }

  // ---------------------------------------------------------------- targeting

  /** Default objective when nothing is in sight: princess tower of the unit's lane, else the king. */
  laneTower(u) {
    const enemy = 1 - u.team;
    const lane = arena.laneOf(u.x);
    const princess = this.getTower(enemy, lane);
    if (princess && princess.alive) return princess;
    const king = this.getTower(enemy, 'center');
    if (king && king.alive) return king;
    return null;
  }

  findTarget(u) {
    const stationary = u.speed === 0;
    const reach = stationary ? u.range : u.sight;
    let best = null;
    let bestD = Infinity;
    for (const e of this.entities) {
      if (!e.alive || e.team === u.team) continue;
      if (!this.matchesFilter(u.targets, e)) continue;
      const d = edgeDist(u, e);
      if (d > reach) continue;
      // Troops don't get distracted by enemy crown towers other than the one they are heading to,
      // but a crown tower in reach is still a valid target.
      if (d < bestD) {
        bestD = d;
        best = e;
      }
    }
    if (best || stationary) return best;
    return this.laneTower(u);
  }

  // ---------------------------------------------------------------- simulation

  tick() {
    if (this.phase === 'ended') return;
    this.tickCount++;
    if (this.phase === 'countdown') {
      this.countdown -= DT;
      if (this.countdown <= 0) {
        this.countdown = 0;
        this.phase = 'regular';
        this.events.push({ e: 'fight' });
      }
      return;
    }

    this.clock += DT;
    const mult = this.elixirMultiplier;
    for (const p of this.players) p.regen(DT, mult);

    for (const e of this.entities) {
      if (e.alive) this.updateEntity(e);
    }
    this.resolveCollisions();
    this.updateProjectiles();
    this.cleanup();
    this.checkEnd();
  }

  updateEntity(e) {
    if (e.lifetime) {
      // Buildings decay over their lifetime.
      e.hp -= (e.maxHp / e.lifetime) * DT;
      if (e.hp <= 0) {
        e.hp = 0;
        e.alive = false;
        return;
      }
    }
    if (e.deployTimer > 0) {
      e.deployTimer -= DT;
      return;
    }
    if (e.stunTimer > 0) {
      e.stunTimer -= DT;
      e.moving = false;
      return;
    }
    if (e.kind === 'tower' && !e.active) return;
    if (e.spawn) {
      e.spawnTimer -= DT;
      if (e.spawnTimer <= 0) {
        e.spawnTimer += e.spawn.interval;
        this.spawnTokens(e, e.spawn.card, e.spawn.count, 1.1, 0.5);
      }
    }

    // (re)acquire target
    let t = e.target != null ? this.entities.find((x) => x.id === e.target) : null;
    if (t && !t.alive) t = null;
    const inRange = t && edgeDist(e, t) <= e.range;
    const locked = t && inRange && (e.attacking || e.speed === 0);
    if (!locked) {
      e.retargetTimer -= DT;
      if (!t || e.retargetTimer <= 0 || (e.speed === 0 && !inRange)) {
        e.retargetTimer = UNIT.retargetInterval;
        const nt = this.findTarget(e);
        if (nt !== t) e.atkTimer = Math.max(e.atkTimer, e.firstHit);
        t = nt;
      }
    }
    e.target = t ? t.id : null;
    if (!t) {
      e.moving = false;
      e.attacking = false;
      return;
    }

    const dist = edgeDist(e, t);
    if (dist <= e.range) {
      e.moving = false;
      e.attacking = true;
      e.facing = Math.atan2(t.y - e.y, t.x - e.x);
      if (e.ramp) {
        if (e.rampTarget !== t.id) {
          e.rampTarget = t.id;
          e.rampTime = 0;
        }
        e.rampTime += DT;
      }
      e.atkTimer -= DT;
      if (e.atkTimer <= 0) {
        this.attack(e, t);
        e.atkTimer += e.hitSpeed;
      }
      return;
    }

    e.attacking = false;
    e.atkTimer = Math.max(e.atkTimer - DT, e.firstHit);
    if (e.ramp) e.rampTime = 0;
    if (e.speed <= 0) return;

    // move
    let goal;
    if (e.flying || e.jumpsRiver) goal = { x: t.x, y: t.y };
    else goal = arena.groundWaypoint(e.x, e.y, t.x, t.y);
    let dx = goal.x - e.x;
    let dy = goal.y - e.y;
    const len = Math.hypot(dx, dy);
    if (len > 1e-6) {
      dx /= len;
      dy /= len;
      if (!e.flying) [dx, dy] = this.avoidBuildings(e, t, dx, dy);
      const speed = e.charging ? e.speed * e.charge.speedMult : e.speed;
      const step = Math.min(len, speed * DT);
      e.x += dx * step;
      e.y += dy * step;
      if (e.charge && !e.charging) {
        e.chargeDist += step;
        if (e.chargeDist >= e.charge.distance) e.charging = true;
      }
      e.facing = Math.atan2(dy, dx);
      e.moving = true;
    }
  }

  /**
   * Steer a ground unit around towers / buildings (and water) standing between it and its goal:
   * sample directions fanning out from the goal direction and keep the first free one.
   * The chosen side is remembered so units don't dither between left and right.
   */
  avoidBuildings(e, target, dx, dy) {
    const LOOK = 0.9;
    const solids = [];
    for (const s of this.entities) {
      if (!s.alive || !s.isBuilding || s === target) continue;
      if (Math.hypot(s.x - e.x, s.y - e.y) < s.radius + e.radius + LOOK + 0.2) solids.push(s);
    }
    const blocked = (ang) => {
      const cx = Math.cos(ang);
      const cy = Math.sin(ang);
      for (const s of solids) {
        const vx = s.x - e.x;
        const vy = s.y - e.y;
        const along = vx * cx + vy * cy;
        if (along <= 0) continue;
        const proj = Math.min(LOOK, along);
        const px = e.x + cx * proj - s.x;
        const py = e.y + cy * proj - s.y;
        const R = s.radius + e.radius + 0.05;
        if (px * px + py * py < R * R) return true;
      }
      return !e.jumpsRiver && arena.isWater(e.x + cx * LOOK, e.y + cy * LOOK) && !arena.isWater(e.x, e.y);
    };
    const base = Math.atan2(dy, dx);
    if (!blocked(base)) {
      e.avoidSide = 0;
      return [dx, dy];
    }
    const first = e.avoidSide || (e.id % 2 ? 1 : -1);
    for (let step = 0.35; step < Math.PI; step += 0.35) {
      for (const side of [first, -first]) {
        const ang = base + side * step;
        if (!blocked(ang)) {
          e.avoidSide = side;
          return [Math.cos(ang), Math.sin(ang)];
        }
      }
    }
    return [dx, dy];
  }

  attack(e, t) {
    const src = e.kind === 'tower' ? null : e.card;
    let damage = e.damage;
    if (e.ramp) damage = Math.round(e.ramp.min + (e.ramp.max - e.ramp.min) * Math.min(1, e.rampTime / e.ramp.time));
    if (e.charging) {
      damage *= e.charge.damageMult;
      this.events.push({ e: 'charge', id: e.id, x: t.x, y: t.y });
    }
    e.charging = false;
    e.chargeDist = 0;
    this.events.push({ e: 'atk', id: e.id });
    if (e.projectile) {
      this.projectiles.push({
        id: this.nextId++, team: e.team, kind: e.projectile.kind, arc: !!e.projectile.arc, source: src,
        x: e.x, y: e.y, sx: e.x, sy: e.y, tx: t.x, ty: t.y, targetId: t.id,
        speed: e.projectile.speed, damage, splash: e.splash, filter: e.targets,
      });
      return;
    }
    if (e.splashSelf) {
      this.events.push({ e: 'spin', id: e.id, x: e.x, y: e.y, r: e.splashSelf });
      this.splashDamage(e.team, e.x, e.y, e.splashSelf + e.radius, damage, e.targets, src);
      if (t.alive && edgeDist(e, t) <= e.range + 0.01 && Math.hypot(t.x - e.x, t.y - e.y) - t.radius > e.splashSelf + e.radius) {
        this.dealDamage(t, damage, e.team, src);
      }
      return;
    }
    if (t.kind === 'tower') damage = Math.round(damage * e.towerDamagePct);
    this.dealDamage(t, damage, e.team, src);
  }

  /** Spawn `count` token units around a parent entity (Witch skeletons, Golemites). */
  spawnTokens(parent, cardId, count, radius, deployTime) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + (parent.team ? Math.PI / 2 : -Math.PI / 2);
      const u = this.spawnUnit(parent.team, cardId, parent.x + Math.cos(a) * radius, parent.y + Math.sin(a) * radius, deployTime, parent.level);
      this.keepInBounds(u);
    }
    this.events.push({ e: 'summon', x: parent.x, y: parent.y, team: parent.team });
  }

  updateProjectiles() {
    for (const p of this.projectiles) {
      if (p.done) continue;
      if (p.targetId != null) {
        const t = this.entities.find((x) => x.id === p.targetId);
        if (t && t.alive) {
          p.tx = t.x;
          p.ty = t.y;
        } else {
          p.targetId = null;
          p.lostTarget = true;
        }
      }
      const dx = p.tx - p.x;
      const dy = p.ty - p.y;
      const len = Math.hypot(dx, dy);
      const step = p.speed * DT;
      if (len <= step) {
        p.x = p.tx;
        p.y = p.ty;
        p.done = true;
        this.impact(p);
      } else {
        p.x += (dx / len) * step;
        p.y += (dy / len) * step;
      }
    }
    this.projectiles = this.projectiles.filter((p) => !p.done);
  }

  impact(p) {
    if (p.spell) {
      this.applySpell(p.team, p.spell, p.tx, p.ty, p.level);
      return;
    }
    if (p.tunnel) {
      const u = this.spawnUnit(p.team, p.tunnel, p.tx, p.ty, 0.5, p.level);
      this.keepInBounds(u);
      this.events.push({ e: 'emerge', x: p.tx, y: p.ty, team: p.team });
      return;
    }
    if (p.splash) {
      this.events.push({ e: 'splash', x: p.tx, y: p.ty, r: p.splash, kind: p.kind });
      this.splashDamage(p.team, p.tx, p.ty, p.splash, p.damage, p.filter, p.source);
      return;
    }
    if (p.lostTarget) return;
    const t = this.entities.find((x) => x.id === p.targetId);
    if (t && t.alive) this.dealDamage(t, p.damage, p.team, p.source);
  }

  keepInBounds(e) {
    e.x = Math.min(ARENA.width - e.radius, Math.max(e.radius, e.x));
    e.y = Math.min(ARENA.height - e.radius, Math.max(e.radius, e.y));
    if (!e.flying && !e.jumpsRiver) arena.clampToLand(e);
  }

  resolveCollisions() {
    const movers = this.entities.filter((e) => e.alive && !e.isBuilding);
    const solids = this.entities.filter((e) => e.alive && e.isBuilding);
    for (let i = 0; i < movers.length; i++) {
      const a = movers[i];
      for (let j = i + 1; j < movers.length; j++) {
        const b = movers[j];
        if (a.flying !== b.flying) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const min = (a.radius + b.radius) * 0.9;
        if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
        let d = Math.hypot(dx, dy);
        if (d >= min) continue;
        let nx;
        let ny;
        if (d < 1e-4) {
          const ang = this.rng.next() * Math.PI * 2;
          nx = Math.cos(ang);
          ny = Math.sin(ang);
          d = 0;
        } else {
          nx = dx / d;
          ny = dy / d;
        }
        const overlap = min - d;
        // A unit busy attacking holds its ground better than one walking.
        const ma = a.mass * (a.attacking ? 3 : 1);
        const mb = b.mass * (b.attacking ? 3 : 1);
        const wa = mb / (ma + mb);
        const wb = ma / (ma + mb);
        a.x -= nx * overlap * wa * 0.5;
        a.y -= ny * overlap * wa * 0.5;
        b.x += nx * overlap * wb * 0.5;
        b.y += ny * overlap * wb * 0.5;
        // Two walkers bumping into each other both sidestep to their right (e.g. two giants on a bridge).
        if (a.moving && b.moving && (a.team !== b.team || a.target !== b.target)) {
          const side = overlap * 0.35;
          a.x += -Math.sin(a.facing) * side;
          a.y += Math.cos(a.facing) * side;
          b.x += -Math.sin(b.facing) * side;
          b.y += Math.cos(b.facing) * side;
        } else if (a.moving !== b.moving) {
          // A walker blocked by a unit standing still (e.g. an ally already hitting the tower) slides around it.
          const [m, o, sgn] = a.moving ? [a, b, 1] : [b, a, -1];
          const fx = Math.cos(m.facing);
          const fy = Math.sin(m.facing);
          const cross = fx * (ny * sgn) - fy * (nx * sgn);   // which side of the walker the blocker is on
          const dir = cross >= 0 ? -1 : 1;

const { CARDS } = require('./cards');

  constructor(team, deck, rng) {

    this.elixirSpent = 0;
    this.elixirWasted = 0;
  }

  get next() {
    return this.queue[0];
  }

  regen(dt, mult) {
    const gain = (dt * mult) / ELIXIR.secondsPerPoint;
    const room = ELIXIR.max - this.elixir;
    if (gain > room) this.elixirWasted += gain - room;
    this.elixir = Math.min(ELIXIR.max, this.elixir + gain);
  }

    const id = this.hand[slot];
    return !!id && this.elixir >= CARDS[id].cost;

  consume(slot) {
    const id = this.hand[slot];
    const card = CARDS[id];
    this.elixir -= card.cost;
    this.elixirSpent += card.cost;
    this.cardsPlayed++;
    this.hand[slot] = this.queue.shift();
    this.queue.push(id);
    return id;
  }

function inRiverBand(y) {

  POCKET_DEPTH,
  mirrorY,
  toWorld,
  towerLayout,
  sideOf,
  inRiverBand,
  nearestBridge,
  laneOf,
  inBounds,
  canDeploy,
  groundWaypoint,
  clampToLand,
  isWater,
};

'use strict';

// Ghost AI: the regular AI brain, biased by a player's recorded habits (see server/meta/ghost.js).
// It opens with the player's favourite opener, attacks with the cards the player attacks with,
// drops them where the player drops them, waits for the same amount of elixir and defends with the
// player's defensive cards.
const { AIController, difficultyForTrophies } = require('./ai');
const { CARDS } = require('./cards');

class GhostAI extends AIController {
  /**
   * @param opts.model     ghost model of the imitated player
   * @param opts.trophies  that player's trophies (sets the raw skill level)
   */
  constructor(game, team, { model, trophies = 1000, seed } = {}) {
    const base = difficultyForTrophies(Math.max(800, trophies));
    const spellAffinity = model.plays ? model.spells / model.plays : 0.15;
    const params = {
      ...base,
      blunder: 0,
      distracted: 0.05,
      noise: 0.35,
      attackAt: Math.min(10, Math.max(5, model.attackElixir || base.attackAt)),
      // players who love spells get a ghost that fires them more readily
      spellRatio: Math.max(0.9, Math.min(2.2, base.spellRatio * (1.25 - spellAffinity * 1.5))),
      label: 'normal',
    };
    super(game, team, { params, seed });
    this.model = model;
    this.opened = false;
  }

  cardStats(id) {
    return this.model.cards[id] || { off: 0, def: 0, so: [], sd: [] };
  }

  /** One of the player's recorded drop spots for this card (local coordinates), or null. */
  sampleSpot(id, kind) {
    const c = this.cardStats(id);
    const spots = kind === 'off' ? c.so : c.sd;
    if (!spots || !spots.length) return null;
    return spots[Math.floor(this.rng.next() * spots.length)];
  }

  weightedPick(cards, weight) {
    const total = cards.reduce((s, c) => s + weight(c), 0);
    let r = this.rng.next() * total;
    for (const c of cards) {
      r -= weight(c);
      if (r <= 0) return c;
    }
    return cards[cards.length - 1];
  }

  scoreDefender(c, T) {
    const s = super.scoreDefender(c, T);
    if (s === -Infinity) return s;
    const st = this.cardStats(c.id);
    const n = st.off + st.def;
    // the cards this player trusts on defence get a strong preference
    return n ? s + 3 * (st.def / n) : s;
  }

  attack(hand, me, mine, underPressure) {
    const m = this.model;
    if (!this.opened) {
      // (older models may hold a spell as opener: spells are never used to open)
      const openerId = Object.entries(m.opener)
        .filter(([id]) => CARDS[id] && CARDS[id].type !== 'spell')
        .sort((a, b) => b[1] - a[1])[0]?.[0];
      const card = openerId && hand.find((c) => c.id === openerId);
      if (!card || this.game.clock > 30) {
        this.opened = true;
      } else {
        const want = Math.min(10, Math.max(card.cost, m.openerElixir || card.cost));
        if (me.elixir < want) return;
        const spot = this.sampleSpot(card.id, 'off') || this.sampleSpot(card.id, 'def');
        this.opened = true;
        if (spot && this.tryPlay(card.slot, spot[0], spot[1], true, 'ghost-opener')) return;
      }
    }
    const full = me.elixir >= 9.6;
    if (underPressure && !full) return;
    if (me.elixir < this.cfg.attackAt && !full) {
      super.attack(hand, me, mine, underPressure);   // may still support a push in progress
      return;
    }
    const playable = hand.filter((c) => c.cost <= me.elixir && !c.spell);
    if (!playable.length) return;
    const pick = this.weightedPick(playable, (c) => this.cardStats(c.id).off + 0.3);
    const spot = this.sampleSpot(pick.id, 'off');
    if (spot && this.tryPlay(pick.slot, spot[0], spot[1], true, 'ghost')) return;
    super.attack(hand, me, mine, underPressure);
  }
}

module.exports = { GhostAI };

defs["server/game/levels.js"] = function (module, exports, require, process) {
'use strict';

// Card / tower levels: every level adds 10% hitpoints and damage (like Clash Royale).
const MAX_LEVEL = 9;

function clampLevel(level) {
  const l = Math.round(Number(level) || 1);
  return Math.max(1, Math.min(MAX_LEVEL, l));
}

function statMult(level) {
  return Math.pow(1.1, clampLevel(level) - 1);
}

function scale(value, level) {
  return Math.round(value * statMult(level));
}

module.exports = { MAX_LEVEL, clampLevel, statMult, scale };

};
defs["server/game/rng.js"] = function (module, exports, require, process) {
'use strict';

// Small seedable PRNG (mulberry32) so simulations and tests are reproducible.
function createRng(seed = Date.now()) {
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    range: (a, b) => a + (b - a) * next(),
    int: (a, b) => a + Math.floor(next() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    chance: (p) => next() < p,
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
}

module.exports = { createRng };

};
defs["server/game/snapshot.js"] = function (module, exports, require, process) {
'use strict';

const { ARENA, TOWER_LAYOUT, TIMING, ELIXIR, TICK_RATE, SNAPSHOT_RATE } = require('./constants');
const { CARDS } = require('./cards');
const { POCKET_DEPTH } = require('./arena');

const r2 = (v) => Math.round(v * 100) / 100;

/** Static data sent once when a match starts. */
function initMessage(game, team) {
  return {
    t: 'init',
    you: team,
    arena: { ...ARENA, pocketDepth: POCKET_DEPTH },
    towerLayout: TOWER_LAYOUT,
    timing: TIMING,
    elixir: ELIXIR,
    tickRate: TICK_RATE,
    snapshotRate: SNAPSHOT_RATE,
    cards: CARDS,
    decks: game.players.map((p) => p.deck),
  };
}

/** Per-viewer state: only the viewer's own hand/elixir is revealed. */
function stateMessage(game, team, events) {
  const me = game.players[team];
  const entities = [];
  for (const e of game.entities) {
    const o = {
      id: e.id,
      k: e.kind,
      c: e.card,
      tm: e.team,
      x: r2(e.x),
      y: r2(e.y),
      hp: Math.ceil(e.hp),
      mhp: e.maxHp,
      r: e.radius,
    };
    if (e.kind === 'tower') {
      o.act = e.active ? 1 : 0;
      o.al = e.alive ? 1 : 0;
      o.l = e.lane;
      o.lv = e.level;
    } else {
      o.f = r2(e.facing || 0);
      if (e.flying) o.fl = 1;
      if (e.moving) o.mv = 1;
      if (e.attacking) o.at = 1;
      if (e.deployTimer > 0) o.dp = r2(e.deployTimer);
      if (e.stunTimer > 0) o.st = 1;
      if (e.lifetime) o.lt = 1;
      if (e.charging) o.ch = 1;
      if (e.level > 1) o.lv = e.level;
    }
    if (e.target != null && e.kind !== 'tower') o.tg = e.target;
    entities.push(o);
  }
  const projectiles = game.projectiles.map((p) => ({
    id: p.id,
    k: p.kind,
    tm: p.team,
    x: r2(p.x),
    y: r2(p.y),
    sx: r2(p.sx),
    sy: r2(p.sy),
    tx: r2(p.tx),
    ty: r2(p.ty),
    a: p.arc ? 1 : 0,
    sp: p.spell ? 1 : 0,
  }));
  return {
    t: 'state',
    tick: game.tickCount,
    phase: game.phase,
    countdown: r2(game.countdown),
    remaining: r2(game.remaining),
    mult: game.elixirMultiplier,
    crowns: game.players.map((p) => p.crowns),
    me: {
      elixir: r2(me.elixir),
      hand: me.hand.slice(),
      next: me.next,
    },
    pockets: [...game.destroyedEnemyLanes(team)],
    entities,
    projectiles,
    events,
    winner: game.winner,
    endReason: game.endReason,
    stats: game.phase === 'ended' ? summary(game) : undefined,
  };
}

function summary(game) {
  return {
    duration: Math.round(game.clock),
    towerDamage: game.stats.towerDamage.map(Math.round),
    played: game.stats.played,
    elixirSpent: game.players.map((p) => p.elixirSpent),
    elixirWasted: game.players.map((p) => Math.round(p.elixirWasted * 10) / 10),
  };
}

module.exports = { initMessage, stateMessage, summary };

};
defs["server/local.js"] = function (module, exports, require, process) {
'use strict';
const { Match } = require('./Match');
const { CARDS, DEFAULT_DECK } = require('./game/cards');
const { DT, ARENA, TOWER_LAYOUT } = require('./game/constants');
const { POCKET_DEPTH } = require('./game/arena');
const { MAX_LEVEL } = require('./game/levels');
const { Db } = require('./meta/db');
const { MetaService } = require('./meta/service');
const { ClanService, CLAN_CREATE_COST, REQUEST_COOLDOWN, CLAN_CHEST_TIERS, ROLE_NAMES } = require('./meta/clans');
const { createApi } = require('./meta/api');
const { ARENAS } = require('./meta/arenas');
const { CHESTS } = require('./meta/chests');
const eco = require('./meta/economy');
const { TROPHY_ROAD, PASS, PASS_REWARDS, QUEST_TYPES } = require('./meta/progression');

const log = (...a) => console.debug('[serveur]', ...a);
const db = new Db();
const meta = new MetaService(db);
const online = new Map();
const clans = new ClanService(db, meta, { isOnline: (id) => online.has(id) && online.get(id).size > 0 });

function sendTo(playerId, msg) {
  const set = online.get(playerId);
  if (!set) return;
  const text = JSON.stringify(msg);
  for (const ws of set) if (ws.open) ws.send(text);
}

const push = {
  profile(playerId) {
    const p = meta.get(playerId);
    if (p && online.has(playerId)) sendTo(playerId, { t: 'profile', profile: meta.view(p) });
  },
  clan(clanId) {
    const clan = clans.get(clanId);
    if (!clan) return;
    for (const m of clan.members) if (online.has(m.id)) sendTo(m.id, { t: 'clan', clan: clans.view(clan, m.id) });
  },
  clanGone(playerId) {
    sendTo(playerId, { t: 'clan', clan: null });
  },
};
const api = createApi({ meta, clans, push });

const CONFIG = {
  cards: CARDS,
  geometry: { ...ARENA, pocketDepth: POCKET_DEPTH },
  towerLayout: TOWER_LAYOUT,
  defaultDeck: DEFAULT_DECK,
  arenas: ARENAS,
  chests: CHESTS,
  rarities: eco.RARITIES,
  upgradeGold: eco.UPGRADE_GOLD,
  kingXp: eco.KING_XP,
  maxLevel: MAX_LEVEL,
  trophyRoad: TROPHY_ROAD,
  pass: { ...PASS, rewards: PASS_REWARDS },
  questTypes: QUEST_TYPES,
  clan: { createCost: CLAN_CREATE_COST, requestCooldown: REQUEST_COOLDOWN, chestTiers: CLAN_CHEST_TIERS, roles: ROLE_NAMES },
};

const matches = new Set();

/** Opens an in-page "socket". deliver(text) receives server messages; returns {send, close}. */
function connect(deliver) {
  const ws = { open: true, send(text) { if (this.open) setTimeout(() => deliver(text), 0); } };
  const session = { playerId: null };
  let match = null;
  const reply = (msg) => ws.open && ws.send(JSON.stringify(msg));
  reply({ t: 'hello', config: CONFIG, cards: CARDS, defaultDeck: DEFAULT_DECK });

  const login = (p) => {
    if (session.playerId && online.has(session.playerId)) online.get(session.playerId).delete(ws);
    session.playerId = p.id;
    if (!online.has(p.id)) online.set(p.id, new Set());
    online.get(p.id).add(ws);
    reply({ t: 'profile', profile: meta.view(p) });
    reply({ t: 'clan', clan: p.clanId && clans.get(p.clanId) ? clans.view(clans.get(p.clanId), p.id) : null });
    if (p.clanId) push.clan(p.clanId);
  };

  const onMessage = (raw) => {
    let msg;
    try { msg = JSON.parse(raw); } catch { return; }
    try {
      switch (msg.t) {
        case 'register': {
          const { token, profile } = meta.register(msg.name);
          reply({ t: 'registered', token });
          login(profile);
          break;
        }
        case 'auth':
          login(meta.auth(msg.token));
          break;
        case 'meta':
          api(session, msg, reply);
          break;
        case 'start': {
          if (match) { match.forfeit(); matches.delete(match); }
          const profile = session.playerId ? meta.get(session.playerId) : null;
          let ghostOwner = null;
          if (msg.mode === 'ghost') {
            ghostOwner = meta.get(String(msg.target || ''));
            if (!profile || !meta.ghostReady(ghostOwner)) {
              reply({ t: 'error', code: 'ghost', error: "Ce fantôme n'est pas encore réveillé." });
              match = null;
              break;
            }
          }
          match = new Match(ws, {
            ghostOwner,
            onGhostDuel: (owner, challenger, duel) => {
              const clan = clans.announceDuel(owner, challenger, duel.text);
              if (clan) push.clan(clan.id);
              if (owner.id !== challenger.id) push.profile(owner.id);
            },
            mode: msg.mode,
            difficulty: msg.difficulty,
            profile,
            meta,
            clans,
            log,
            onRewards: (p) => {
              push.profile(p.id);
              if (p.clanId) push.clan(p.clanId);
            },
          });
          matches.add(match);
          break;
        }
        case 'play':
          if (match) match.play(Number(msg.slot), Number(msg.x), Number(msg.y));
          break;
        case 'leave':
          if (match) { match.forfeit(); matches.delete(match); }
          match = null;
          break;
        default:
          break;
      }
    } catch (err) {
      if (err && err.code && err.message) reply({ t: 'error', code: err.code, error: err.message });
      else console.error('[serveur] erreur', err);
    }
  };

  return {
    send: (text) => setTimeout(() => onMessage(text), 0),
    close() {
      ws.open = false;
      if (match) { match.forfeit(); matches.delete(match); }
      match = null;
      if (session.playerId && online.has(session.playerId)) online.get(session.playerId).delete(ws);
    },
  };
}

let last = performance.now();
let acc = 0;
setInterval(() => {
  const now = performance.now();
  acc += (now - last) / 1000;
  last = now;
  if (acc > 0.25) acc = 0.25;
  while (acc >= DT) {
    acc -= DT;
    for (const m of matches) {
      try { m.step(); } catch (err) { console.error('[serveur] partie plantée', err); matches.delete(m); }
      if (m.finished) matches.delete(m);
    }
  }
}, 4);

const flush = () => { try { db.flush(); } catch { /* ignore */ } };
addEventListener('pagehide', flush);
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

module.exports = { connect };

};
defs["server/meta/api.js"] = function (module, exports, require, process) {
'use strict';

// WebSocket API for everything outside of battles: {t:'meta', a:'<action>', ...params, rid}
// Replies {t:'meta', a, rid, ok, result?, error?} and pushes fresh profile / clan views.
const { MetaError } = require('./service');

function createApi({ meta, clans, push }) {
  // push.profile(playerId), push.clan(clanId), push.clanGone(playerId)
  const actions = {
    'deck.set': (p, m) => meta.setDeck(p, Number(m.slot), m.cards),
    'deck.select': (p, m) => meta.selectDeck(p, Number(m.slot)),
    'card.upgrade': (p, m) => meta.upgradeCard(p, String(m.card)),
    'chest.unlock': (p, m) => meta.unlockChest(p, Number(m.slot)),
    'chest.open': (p, m) => meta.openChest(p, Number(m.slot)),
    'freechest.open': (p) => meta.openFreeChest(p),
    'crownchest.open': (p) => meta.openCrownChest(p),
    'road.claim': (p, m) => meta.claimRoad(p, Number(m.index)),
    'shop.buy': (p, m) => meta.buy(p, m.offer),
    'pass.buy': (p) => meta.buyPass(p),
    'pass.claim': (p, m) => meta.claimPass(p, Number(m.tier), m.track),
    'quest.claim': (p, m) => meta.claimQuest(p, Number(m.id)),
    'quest.reroll': (p, m) => meta.rerollQuest(p, Number(m.id)),
    profile: () => null,       // just re-sends the fresh profile (timers ticking over)
    leaderboard: () => clans.leaderboard(),
    'ghost.profile': (p, m) => {
      const target = meta.get(String(m.player || p.id));
      if (!target) throw new MetaError('unknown', 'Joueur introuvable.');
      return meta.ghostCard(target);
    },
    'clan.list': (p, m) => clans.list(m.query),
    'clan.view': (p) => clans.view(clans.clanOf(p), p.id),
    'clan.create': (p, m) => {
      const c = clans.create(p, m);
      push.clan(c.id);
    },
    'clan.join': (p, m) => {
      const c = clans.join(p, String(m.id));
      push.clan(c.id);
    },
    'clan.leave': (p) => {
      const id = p.clanId;
      const c = clans.leave(p);
      push.clanGone(p.id);
      if (c) push.clan(id);
    },
    'clan.kick': (p, m) => {
      const { clan, targetId } = clans.manage(p, String(m.member), 'kick');
      push.clan(clan.id);
      push.clanGone(targetId);
      push.profile(targetId);
    },
    'clan.promote': (p, m) => push.clan(clans.manage(p, String(m.member), 'promote').clan.id),
    'clan.demote': (p, m) => push.clan(clans.manage(p, String(m.member), 'demote').clan.id),
    'clan.chat': (p, m) => push.clan(clans.chat(p, m.text).id),
    'clan.request': (p, m) => push.clan(clans.request(p, String(m.card)).id),
    'clan.donate': (p, m) => {
      const r = clans.donate(p, Number(m.msg));
      push.clan(r.clan.id);
      push.profile(r.recipientId);
      return { gold: r.gold, xp: r.xp };
    },
    'clan.chest': (p) => {
      const r = clans.claimChest(p);
      push.clan(p.clanId);
      return r;
    },
  };

  return function handle(session, msg, reply) {
    const a = String(msg.a || '');
    const fn = actions[a];
    if (!fn) return reply({ t: 'meta', a, rid: msg.rid, ok: false, error: 'Action inconnue.' });
    const p = session.playerId ? meta.get(session.playerId) : null;
    if (!p) return reply({ t: 'meta', a, rid: msg.rid, ok: false, error: 'Non connecté.' });
    try {
      const result = fn(p, msg);
      push.profile(p.id);         // fresh profile first, so the client's reply handler sees up-to-date state
      reply({ t: 'meta', a, rid: msg.rid, ok: true, result: result === undefined ? null : result });
    } catch (err) {
      if (err instanceof MetaError) reply({ t: 'meta', a, rid: msg.rid, ok: false, error: err.message, code: err.code });
      else throw err;
    }
    return null;
  };
}

module.exports = { createApi };

};

  gold: { name: "Coffre d'or", unlock: 480, cards: [38, 12], gold: [110, 30], stacks: 4, rare: [2, 0.6], epicChance: 0.15, legendaryChance: 0.01 },

  giant: { name: 'Coffre géant', unlock: 720, cards: [160, 40], gold: [400, 80], stacks: 5, rare: [10, 3], epicChance: 0.35, legendaryChance: 0.03 },
  epic: { name: 'Coffre épique', unlock: 0, cards: [10, 2], gold: [0, 0], stacks: 3, onlyRarity: 'epic' },
  legendary: { name: 'Coffre légendaire', unlock: 0, cards: [1, 0], gold: [0, 0], stacks: 1, onlyRarity: 'legendary' },
  clan: { name: 'Coffre de clan', unlock: 0, cards: [30, 10], gold: [150, 40], stacks: 4, rare: [2, 0.5], epicChance: 0.2 },

// Economy tables: rarities, upgrade costs, king levels, battle rewards.
const { MAX_LEVEL } = require('../game/levels');

const RARITIES = {
  // copies[i] / gold[i]: cost to go from level i+1 to level i+2
  common: { name: 'Commune', copies: [2, 4, 10, 20, 50, 100, 200, 400], donateMax: 8, donateGold: 5, donateXp: 1, shopPrice: 10 },
  rare: { name: 'Rare', copies: [1, 2, 4, 8, 16, 30, 50, 80], donateMax: 1, donateGold: 50, donateXp: 10, shopPrice: 100 },
  epic: { name: 'Épique', copies: [1, 1, 2, 4, 8, 12, 20, 30], donateMax: 0, shopPrice: 1000 },
  legendary: { name: 'Légendaire', copies: [1, 1, 1, 2, 3, 5, 8, 12], donateMax: 0, shopPrice: 20000 },
};

const UPGRADE_GOLD = [5, 20, 50, 150, 400, 1000, 2000, 4000];
const UPGRADE_XP = [4, 5, 6, 10, 25, 50, 100, 200];

// Total experience needed to reach king level (index + 1).
const KING_XP = [0, 20, 60, 150, 350, 700, 1300, 2300, 4000];
const KING_LEVEL_UP_GEMS = 20;

function kingLevel(xp) {
  let lvl = 1;
  for (let i = 0; i < KING_XP.length; i++) if (xp >= KING_XP[i]) lvl = i + 1;
  return lvl;
}

function upgradeCost(rarity, level) {
  if (level >= MAX_LEVEL) return null;
  const r = RARITIES[rarity];
  return { copies: r.copies[level - 1], gold: UPGRADE_GOLD[level - 1], xp: UPGRADE_XP[level - 1] };
}

// Ladder results
const TROPHIES = { win: 30, loss: -28 };
function battleGold(arena, win) {
  return win ? 12 + arena * 5 : 0;
}

// Unlocking a chest faster costs gems: 2 gems per remaining minute (min 1).
function speedUpCost(secondsLeft) {
  return Math.max(1, Math.ceil(secondsLeft / 60) * 2);
}

module.exports = {
  RARITIES, UPGRADE_GOLD, UPGRADE_XP, KING_XP, KING_LEVEL_UP_GEMS, MAX_LEVEL,
  kingLevel, upgradeCost, TROPHIES, battleGold, speedUpCost,
};

defs["server/meta/ghost.js"] = function (module, exports, require, process) {
'use strict';

// "Fantômes": every human battle teaches the server how that player plays (cards used in attack vs
// defence, drop spots, elixir patience, favourite lane, opening move...). The resulting model drives a
// ghost AI that imitates the player — others (and the player) can challenge it while they are offline.
const { CARDS } = require('../game/cards');

const MAX_SPOTS = 14;              // drop spots remembered per card and per context
const READY_BATTLES = 3;           // battles needed before the ghost "wakes up"
const READY_PLAYS = 15;
const OPENING_WINDOW = 25;         // seconds: the first troop/building played in this window is the "opener"
const DEFENCE_RADIUS = 7;          // a drop this close to an attacking enemy troop counts as defence
const BOUNTY_GOLD = 25;            // owner reward when their ghost wins
const BOUNTY_PER_DAY = 5;
const HUNTER_GOLD = 15;            // challenger reward for beating someone else's ghost
const HUNTER_PER_DAY = 5;

function emptyModel() {
  return {
    battles: 0,
    plays: 0,
    off: 0,
    def: 0,
    spells: 0,
    spellTower: 0,
    costSum: 0,
    bridge: 0,                   // offensive drops close to the river
    lanes: { left: 0, right: 0 },
    attackElixir: 0,             // running average of elixir held when launching an attack
    attackSamples: 0,
    opener: {},                  // cardId -> times used as first play
    openerElixir: 0,
    cards: {},                   // cardId -> { off, def, so: [[x,y]], sd: [[x,y]] }
    record: { w: 0, l: 0 },
    news: [],                    // latest duels against this ghost
    bounty: { day: null, n: 0 },
    hunter: { day: null, n: 0 },
  };
}

// ------------------------------------------------------------------ recording (one battle)

/** Records the human plays of a match (team 0, whose world coordinates are the "local" ones). */
class GhostRecorder {
  constructor() {
    this.events = [];
  }

  /**
   * @param game       Game (after the card was played)
   * @param cardId     card played
   * @param x, y       drop position (team-0 coordinates)
   * @param elixir     elixir the player had before paying for the card
   */
  record(game, cardId, x, y, elixir) {
    const card = CARDS[cardId];
    // Defensive only if the card lands on our half *close to* an enemy troop threatening us:
    // a push on the other lane while being attacked is still an attack (counter-push / split).
    const ownSide = card.type === 'spell' ? y >= 13 : y >= 17;
    const threat = game.entities.some((e) => e.alive && e.team === 1 && e.kind === 'unit' && e.y >= 12 &&
      Math.hypot(e.x - x, e.y - y) <= DEFENCE_RADIUS);
    const kind = threat && ownSide ? 'def' : 'off';
    this.events.push({ card: cardId, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, elixir, t: game.clock, kind, spell: card.type === 'spell' });
  }
}

/** Merge one battle's plays into a player's ghost model. */
function learn(model, events) {
  if (!events.length) return model;
  model.battles++;
  // Spells are reactions, not openings: the opener is the first troop or building.
  const first = events.find((e) => e.t <= OPENING_WINDOW && !e.spell);
  if (first) {
    model.opener[first.card] = (model.opener[first.card] || 0) + 1;
    const n = Object.values(model.opener).reduce((a, b) => a + b, 0);
    model.openerElixir += (first.elixir - model.openerElixir) / n;
  }
  for (const e of events) {
    model.plays++;
    model.costSum += CARDS[e.card].cost;
    const c = (model.cards[e.card] = model.cards[e.card] || { off: 0, def: 0, so: [], sd: [] });
    c[e.kind]++;
    model[e.kind]++;
    const spots = e.kind === 'off' ? c.so : c.sd;
    spots.push([e.x, e.y]);
    if (spots.length > MAX_SPOTS) spots.shift();
    if (e.spell) {
      model.spells++;
      if (e.y < 10) model.spellTower++;
    } else {
      model.lanes[e.x < 9 ? 'left' : 'right']++;
      if (e.kind === 'off') {
        if (e.y < 21) model.bridge++;
        model.attackSamples++;
        model.attackElixir += (e.elixir - model.attackElixir) / model.attackSamples;
      }
    }
  }
  return model;
}

function isReady(model) {
  return !!model && model.battles >= READY_BATTLES && model.plays >= READY_PLAYS;
}

// ------------------------------------------------------------------ style analysis

const ARCHETYPES = {
  ram: { name: 'Le Bélier', desc: 'Fonce au pont dès que possible et met une pression constante.' },
  fortress: { name: 'La Forteresse', desc: 'Défend patiemment et contre-attaque avec ce qui survit.' },
  alchemist: { name: "L'Alchimiste", desc: 'Adore les sorts : rien ne résiste à ses boules de feu.' },
  colossus: { name: 'Le Colosse', desc: 'Des cartes lourdes, des poussées massives et lentes.' },
  lightning: { name: "L'Éclair", desc: 'Cycle rapide de petites cartes, toujours un coup d\'avance.' },
  strategist: { name: 'Le Stratège', desc: 'Équilibré : attaque et défense au bon moment.' },
};

/** Numbers + archetype describing a play style (all axes in 0..1). */
function styleOf(model) {
  const m = model || emptyModel();
  const plays = Math.max(1, m.plays);
  const troops = Math.max(1, m.lanes.left + m.lanes.right);
  const avgCost = m.plays ? m.costSum / m.plays : 3.5;
  const axes = {
    aggression: m.off / Math.max(1, m.off + m.def),
    pressure: m.off ? m.bridge / Math.max(1, m.attackSamples) : 0,
    spells: m.spells / plays,
    weight: Math.min(1, Math.max(0, (avgCost - 2) / 4)),
    patience: Math.min(1, Math.max(0, (m.attackElixir - 3) / 7)),
  };
  let arch = 'strategist';
  if (axes.spells >= 0.3) arch = 'alchemist';
  else if (avgCost >= 4.3) arch = 'colossus';
  else if (avgCost <= 3.1) arch = 'lightning';
  else if (axes.aggression >= 0.62 && axes.pressure >= 0.5) arch = 'ram';
  else if (axes.aggression <= 0.4) arch = 'fortress';
  const top = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1])[0];
  const signature = Object.entries(m.cards).sort((a, b) => b[1].off + b[1].def - (a[1].off + a[1].def))[0];
  const opener = top(m.opener);
  return {
    archetype: arch,
    name: ARCHETYPES[arch].name,
    desc: ARCHETYPES[arch].desc,
    axes,
    avgCost: Math.round(avgCost * 10) / 10,
    lane: m.lanes.left === m.lanes.right ? 'both' : m.lanes.left > m.lanes.right ? 'left' : 'right',
    laneShare: Math.max(m.lanes.left, m.lanes.right) / troops,
    signature: signature ? signature[0] : null,
    opener: opener ? opener[0] : null,
    attackElixir: Math.round(m.attackElixir * 10) / 10,
    battles: m.battles,
    plays: m.plays,
    ready: isReady(m),
    needBattles: Math.max(0, READY_BATTLES - m.battles),
    record: m.record,
  };
}

// ------------------------------------------------------------------ duel results

/**
 * Settle a duel against `owner`'s ghost. Returns { ownerGold, hunterGold, text }.
 */
function settleDuel(owner, challenger, ghostWon, dayKey, now) {
  const m = owner.ghost;
  const self = owner.id === challenger.id;
  let ownerGold = 0;
  let hunterGold = 0;
  if (!self) {
    if (ghostWon) m.record.w++;
    else m.record.l++;
    if (ghostWon) {
      if (m.bounty.day !== dayKey) m.bounty = { day: dayKey, n: 0 };
      if (m.bounty.n < BOUNTY_PER_DAY) {
        m.bounty.n++;
        ownerGold = BOUNTY_GOLD;
        owner.gold += BOUNTY_GOLD;
      }
    } else {
      const h = (challenger.ghost = challenger.ghost || emptyModel()).hunter;
      if (h.day !== dayKey) {
        h.day = dayKey;
        h.n = 0;
      }
      if (h.n < HUNTER_PER_DAY) {
        h.n++;
        hunterGold = HUNTER_GOLD;
        challenger.gold += HUNTER_GOLD;
      }
    }
    m.news.unshift({ by: challenger.name, won: ghostWon, gold: ownerGold, at: now });
    m.news = m.news.slice(0, 8);
  }
  const text = self
    ? null
    : ghostWon
      ? `Le fantôme de ${owner.name} a battu ${challenger.name} !`
      : `${challenger.name} a vaincu le fantôme de ${owner.name} !`;
  return { ownerGold, hunterGold, text, self };
}

module.exports = {
  GhostRecorder, learn, emptyModel, isReady, styleOf, settleDuel, ARCHETYPES,
  READY_BATTLES, READY_PLAYS, BOUNTY_GOLD, HUNTER_GOLD,
};

};

'use strict';

// Trophy road, battle pass and daily quest definitions.
const { ARENAS } = require('./arenas');

// ------------------------------------------------------------------ trophy road

function buildTrophyRoad() {
  const road = [];
  ARENAS.forEach((a, i) => {
    if (i > 0) road.push({ trophies: a.trophies, reward: { type: 'arena', arena: i } });
    const next = ARENAS[i + 1] ? ARENAS[i + 1].trophies : a.trophies + 1000;
    const step = i === 0 ? 50 : 100;
    let k = 0;
    for (let t = a.trophies + step; t < next; t += step, k++) {
      let reward;
      switch (k % 5) {
        case 0: reward = { type: 'gold', amount: 80 + i * 60 }; break;
        case 1: reward = { type: 'cards', rarity: 'common', count: 12 + i * 6 }; break;
        case 2: reward = { type: 'chest', chest: i >= 4 ? 'gold' : 'silver' }; break;
        case 3: reward = { type: 'gems', amount: 15 + i * 5 }; break;
        default: reward = i >= 2 ? { type: 'cards', rarity: i >= 5 ? 'epic' : 'rare', count: i >= 5 ? 2 : 4 + i } : { type: 'chest', chest: 'gold' };
      }
      road.push({ trophies: t, reward });
    }
  });
  road.sort((a, b) => a.trophies - b.trophies);
  road.forEach((r, i) => {
    r.index = i;
  });
  return road;
}

const TROPHY_ROAD = buildTrophyRoad();

// ------------------------------------------------------------------ battle pass

const PASS = { tiers: 30, xpPerTier: 100, premiumPrice: 300, seasonDays: 28 };

function passRewards() {
  const free = [];
  const premium = [];
  for (let t = 1; t <= PASS.tiers; t++) {
    switch (t % 5) {
      case 0: free.push(t === PASS.tiers ? { type: 'chest', chest: 'magic' } : { type: 'chest', chest: 'gold' }); break;
      case 1: free.push({ type: 'gold', amount: 100 + t * 10 }); break;
      case 2: free.push({ type: 'cards', rarity: 'common', count: 20 }); break;
      case 3: free.push({ type: 'gold', amount: 150 + t * 10 }); break;
      default: free.push({ type: 'cards', rarity: 'rare', count: 3 });
    }
    if (t === PASS.tiers) premium.push({ type: 'chest', chest: 'legendary' });
    else if (t % 10 === 0) premium.push({ type: 'chest', chest: 'giant' });
    else if (t % 5 === 0) premium.push({ type: 'chest', chest: 'epic' });
    else if (t % 4 === 0) premium.push({ type: 'cards', rarity: 'epic', count: 1 });
    else if (t % 3 === 0) premium.push({ type: 'gems', amount: 15 });
    else if (t % 2 === 0) premium.push({ type: 'cards', rarity: 'rare', count: 6 });
    else premium.push({ type: 'gold', amount: 400 });
  }
  return { free, premium };
}
const PASS_REWARDS = passRewards();

// XP granted to the pass for a ladder battle.
function battlePassXp(crowns, win) {
  return crowns * 10 + (win ? 15 : 5);
}

// ------------------------------------------------------------------ quests

const QUEST_TYPES = {
  win: { text: 'Gagne {n} combats', n: [2, 3], xp: 100, gold: 60 },
  battles: { text: 'Joue {n} combats', n: [3, 4], xp: 60, gold: 40 },
  cards: { text: 'Joue {n} cartes', n: [30, 50], xp: 60, gold: 40 },
  towers: { text: 'Détruis {n} tours', n: [2, 4], xp: 80, gold: 50 },
  crowns: { text: 'Gagne {n} couronnes', n: [4, 6], xp: 80, gold: 50 },
  spell: { text: 'Inflige {n} dégâts avec des sorts', n: [2000, 4000], xp: 60, gold: 40, round: 500 },
  card: { text: 'Joue la carte {card} {n} fois', n: [5, 8], xp: 70, gold: 40 },
  three: { text: 'Remporte une victoire 3 couronnes', n: [1, 1], xp: 150, gold: 100 },
  donate: { text: 'Donne {n} cartes à ton clan', n: [4, 8], xp: 70, gold: 50, clanOnly: true },
};
const QUESTS_PER_DAY = 3;

module.exports = { TROPHY_ROAD, PASS, PASS_REWARDS, battlePassXp, QUEST_TYPES, QUESTS_PER_DAY };

};

'use strict';

// Player progression: accounts, collection & upgrades, chests, shop, trophy road, pass, quests, battle rewards.
const crypto = require('crypto');
const { CARDS, PLAYABLE, DEFAULT_DECK, isValidDeck } = require('../game/cards');
const { createRng } = require('../game/rng');
const { clampLevel, MAX_LEVEL } = require('../game/levels');
const { ARENAS, arenaFor } = require('./arenas');
const eco = require('./economy');
const { CHESTS, CHEST_CYCLE, rollChest, poolByRarity } = require('./chests');
const { TROPHY_ROAD, PASS, PASS_REWARDS, battlePassXp, QUEST_TYPES, QUESTS_PER_DAY } = require('./progression');
const { emptyModel, styleOf, isReady } = require('./ghost');

const DAY = 86400000;
const FREE_CHEST_INTERVAL = 4 * 3600 * 1000;
const FREE_CHEST_MAX = 2;
const CROWN_CHEST_CROWNS = 10;
const CHEST_SLOTS = 4;
const DECK_SLOTS = 3;

class MetaError extends Error {
  constructor(code, message) {
    super(message);
    this.code = code;
  }
}

function fail(code, message) {
  throw new MetaError(code, message);
}

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Archetypes the ladder AI builds its deck from (filtered by what the arena allows).
const AI_ARCHETYPES = [
  ['giant', 'musketeer', 'minipekka', 'archers', 'fireball', 'zap', 'goblins', 'knight'],
  ['hogrider', 'valkyrie', 'musketeer', 'cannon', 'fireball', 'skeletons', 'bomber', 'zap'],
  ['balloon', 'babydragon', 'knight', 'minions', 'arrows', 'fireball', 'bomber', 'skeletons'],
  ['giant', 'wizard', 'babydragon', 'goblins', 'arrows', 'minipekka', 'minions', 'zap'],
  ['golem', 'witch', 'babydragon', 'megaminion', 'zap', 'arrows', 'prince', 'skeletons'],
  ['pekka', 'prince', 'wizard', 'minions', 'zap', 'fireball', 'goblins', 'archers'],
  ['miner', 'princess', 'infernotower', 'valkyrie', 'rocket', 'skeletons', 'knight', 'arrows'],
  ['hogrider', 'megaminion', 'musketeer', 'infernotower', 'fireball', 'zap', 'goblins', 'valkyrie'],
];

const AI_NAMES = ['Gobelin Farceur', 'Sire Bricole', 'Dame Plume', 'Barbare Joyeux', 'Mage Pixel', 'Chevalier Noir', 'La Brute', 'Roi Grincheux',
  'Princesse Rouge', 'Petit Pekka', 'Squelette Rieur', 'Baron Cochon', 'Dragonnet', 'Capitaine Canon', 'Sorcière Verte', 'Golem Tranquille'];

class MetaService {
  constructor(db, { now = () => Date.now() } = {}) {
    this.db = db;
    this.now = now;
  }

  // ---------------------------------------------------------------- time helpers

  dayKey(t = this.now()) {
    return new Date(t).toISOString().slice(0, 10);
  }

  nextMidnight(t = this.now()) {
    return (Math.floor(t / DAY) + 1) * DAY;
  }

  season(t = this.now()) {
    return Math.floor(t / DAY / PASS.seasonDays);
  }

  seasonEnd(t = this.now()) {
    return (this.season(t) + 1) * PASS.seasonDays * DAY;
  }

  weekKey(t = this.now()) {
    return Math.floor((t / DAY + 3) / 7);   // weeks starting on Monday

  register(name) {

    if (clean.length < 3) fail('bad-name', 'Le nom doit faire au moins 3 caractères.');
    const id = crypto.randomBytes(6).toString('hex');
    const token = crypto.randomBytes(18).toString('hex');
    const cards = {};
    for (const cid of DEFAULT_DECK) cards[cid] = { level: 1, count: 0 };
    const p = {
      id,
      name: clean,
      createdAt: this.now(),
      trophies: 0,
      bestTrophies: 0,
      gold: 150,
      gems: 100,
      xp: 0,
      cards,
      decks: Array.from({ length: DECK_SLOTS }, () => DEFAULT_DECK.slice()),
      activeDeck: 0,

  auth(token) {
    const id = this.db.tokens[String(token || '')];

    const now = this.now();
    const fc = p.freeChest;
    if (fc.stock >= FREE_CHEST_MAX) {

      return;
    }
    if (!fc.nextAt) fc.nextAt = now + FREE_CHEST_INTERVAL;
    while (fc.stock < FREE_CHEST_MAX && now >= fc.nextAt) {
      fc.stock++;
      fc.nextAt += FREE_CHEST_INTERVAL;
    }
    if (fc.stock >= FREE_CHEST_MAX) fc.nextAt = null;

  ensurePass(p) {
    const season = this.season();
    if (!p.pass || p.pass.season !== season) p.pass = { season, xp: 0, premium: false, free: [], premiumClaimed: [] };

    const rng = this.rngFor(`${p.id}:quests:${day}`);
    const types = rng.shuffle(Object.keys(QUEST_TYPES).filter((t) => !QUEST_TYPES[t].clanOnly || p.clanId));
