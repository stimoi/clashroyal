    const pick = (rarity) => {
      const free = pool[rarity].filter((id) => !used.has(id));
      const id = free.length ? rng.pick(free) : null;
      if (id) used.add(id);
      return id;
    };
    const price = (rarity, count) => eco.RARITIES[rarity].shopPrice * count;
    const offers = [];
    const add = (rarity, count, free = false) => {
      const card = pick(rarity);
      if (!card) return false;
      offers.push({ id: `d${offers.length}`, card, count, price: free ? 0 : price(rarity, count), currency: 'gold' });
      return true;
    };
    add('common', 10, true);
    add('common', 20);
    add('common', 40);
    add('rare', 3);
    if (!add('epic', 1)) add('rare', 6);
    if (!(pool.legendary.length && add('legendary', 1))) {
      if (!add('epic', 2)) add('rare', 10);
    }
    return offers;
  }

  staticShop(p) {
    const a = this.arena(p);
    return {
      chests: [
        { id: 'c-gold', chest: 'gold', gems: 60 },
        { id: 'c-magic', chest: 'magic', gems: 150 },
        { id: 'c-giant', chest: 'giant', gems: 200 },
        { id: 'c-epic', chest: 'epic', gems: 300 },
        { id: 'c-legendary', chest: 'legendary', gems: 600 },
      ],
      gold: [
        { id: 'g-1', gold: 1000, gems: 60 },
        { id: 'g-2', gold: 5000, gems: 250 },
        { id: 'g-3', gold: 20000, gems: 900 },
      ],
      giftReward: { gold: 100 + a * 25, gems: 10 },
    };
  }

  /** Public description of a player's ghost (for challenges). */
  ghostCard(target) {
    target.ghost = target.ghost || emptyModel();
    const setup = this.battleSetup(target);
    return {
      id: target.id,
      name: target.name,
      trophies: target.trophies,
      level: this.kingLevel(target),
      deck: setup.deck,
      levels: setup.levels,
      style: styleOf(target.ghost),
    };
  }

  ghostReady(target) {
    return !!target && isReady(target.ghost);
  }

  /** Client-facing view of a profile (server computes all timers). */
  view(p) {
    p.ghost = p.ghost || emptyModel();
    this.refreshFreeChest(p);
    this.ensurePass(p);
    this.ensureQuests(p);
    this.ensureShop(p);
    const now = this.now();
    const lvl = this.kingLevel(p);
    const clan = p.clanId && this.db.clans[p.clanId];
    const unlocking = p.chests.some((c) => c && c.unlockEndsAt && c.unlockEndsAt > now);
    return {
      id: p.id,
      name: p.name,
      now,
      trophies: p.trophies,
      bestTrophies: p.bestTrophies,
      arena: this.arena(p),
      gold: p.gold,
      gems: p.gems,
      xp: p.xp,
      kingLevel: lvl,
      kingXp: { from: eco.KING_XP[lvl - 1], to: eco.KING_XP[lvl] ?? null },
      cards: p.cards,
      decks: p.decks,
      activeDeck: p.activeDeck,
      chests: p.chests.map((c, slot) => {
        if (!c) return null;
        const left = c.unlockEndsAt ? Math.max(0, c.unlockEndsAt - now) : null;
        const state = c.unlockEndsAt == null ? 'locked' : left > 0 ? 'unlocking' : 'ready';
        const secs = state === 'locked' ? CHESTS[c.type].unlock : Math.ceil((left || 0) / 1000);
        return { slot, id: c.id, type: c.type, arena: c.arena, state, endsAt: c.unlockEndsAt, gemCost: state === 'ready' ? 0 : eco.speedUpCost(secs), canStart: state === 'locked' && !unlocking };
      }),
      freeChest: { ...p.freeChest },
      crownChest: { crowns: p.crownChest.crowns, needed: CROWN_CHEST_CROWNS, available: p.crownChest.claimedDay !== this.dayKey() },
      roadClaimed: p.roadClaimed,
      shop: { offers: this.shopOffers(p), bought: p.shop.bought, gift: p.shop.gift, refreshAt: this.nextMidnight(), ...this.staticShop(p) },
      pass: { ...p.pass, tier: this.passTier(p), endsAt: this.seasonEnd() },
      quests: { ...p.quests, refreshAt: this.nextMidnight() },
      clanId: p.clanId,
      clanName: clan ? clan.name : null,
      lastRequestAt: p.lastRequestAt,
      stats: p.stats,
      ghost: { ...styleOf(p.ghost), news: p.ghost.news },
    };
  }

  // ---------------------------------------------------------------- inventory

  addXp(p, xp, out) {
    const before = this.kingLevel(p);
    p.xp += xp;
    const after = this.kingLevel(p);
    if (after > before) {
      const gems = (after - before) * eco.KING_LEVEL_UP_GEMS;
      p.gems += gems;
      if (out) out.kingLevelUp = { level: after, gems };
    }
  }

  /** Give gold / gems / cards. Returns a detailed summary for the client animations. */
  grant(p, { gold = 0, gems = 0, cards = [] }) {
    p.gold += gold;
    p.gems += gems;
    const detailed = [];
    for (const { id, count } of cards) {
      if (!CARDS[id] || count <= 0) continue;
      let c = p.cards[id];
      const isNew = !c;
      if (isNew) {
        c = p.cards[id] = { level: 1, count: count - 1 };
        p.stats.cardsFound++;
      } else {
        c.count += count;
      }
      const cost = eco.upgradeCost(CARDS[id].rarity, c.level);
      detailed.push({ id, count, isNew, level: c.level, owned: c.count, next: cost ? cost.copies : null });
    }
    return { gold, gems, cards: detailed };
  }

  /** Random cards of a rarity from the player's pool (falls back to lower rarities). */
  randomCards(p, rarity, count, rng) {
    const pool = poolByRarity(this.arena(p));
    const order = ['legendary', 'epic', 'rare', 'common'];
    let r = rarity;
    while (!pool[r].length) r = order[order.indexOf(r) + 1];
    return [{ id: rng.pick(pool[r]), count }];
  }

  /** Apply a road / pass reward entry. Chest rewards open immediately. */
  applyReward(p, reward, rng) {
    switch (reward.type) {
      case 'gold':
        return { kind: 'loot', ...this.grant(p, { gold: reward.amount }) };
      case 'gems':
        return { kind: 'loot', ...this.grant(p, { gems: reward.amount }) };
      case 'cards':
        return { kind: 'loot', ...this.grant(p, { cards: this.randomCards(p, reward.rarity, reward.count, rng) }) };
      case 'chest':
        return this.openChestContents(p, reward.chest, this.arena(p), rng);
      case 'arena': {
        const cards = PLAYABLE.filter((id) => CARDS[id].arena === reward.arena).map((id) => ({ id, count: 1 }));
        return { kind: 'loot', arenaUnlocked: reward.arena, ...this.grant(p, { gold: 100 * reward.arena, cards }) };
      }
      default:
        fail('bad-reward', 'Récompense inconnue.');
    }
    return null;
  }

  openChestContents(p, type, arena, rng) {
    const loot = rollChest(type, arena, rng);
    return { kind: 'chest', chest: type, arena, ...this.grant(p, loot) };
  }

  // ---------------------------------------------------------------- decks & upgrades

  setDeck(p, slot, cards) {
    if (!Number.isInteger(slot) || slot < 0 || slot >= DECK_SLOTS) fail('bad-slot', 'Emplacement de deck invalide.');
    if (!isValidDeck(cards)) fail('bad-deck', 'Un deck contient 8 cartes différentes.');
    if (!cards.every((id) => p.cards[id])) fail('not-owned', "Tu ne possèdes pas toutes ces cartes.");
    p.decks[slot] = cards.slice();
    this.db.save();
  }

  selectDeck(p, slot) {
    if (!Number.isInteger(slot) || slot < 0 || slot >= DECK_SLOTS) fail('bad-slot', 'Emplacement de deck invalide.');
    p.activeDeck = slot;
    this.db.save();
  }

  upgradeCard(p, id) {
    const c = p.cards[id];
    if (!c) fail('not-owned', "Tu n'as pas encore cette carte.");
    const cost = eco.upgradeCost(CARDS[id].rarity, c.level);
    if (!cost) fail('max-level', 'Niveau maximum atteint.');
    if (c.count < cost.copies) fail('copies', `Il faut ${cost.copies} cartes pour améliorer.`);
    if (p.gold < cost.gold) fail('gold', "Pas assez d'or.");
    c.count -= cost.copies;
    p.gold -= cost.gold;
    c.level++;
    const out = { card: id, level: c.level, xp: cost.xp };
    this.addXp(p, cost.xp, out);
    this.db.save();
    return out;
  }

  // ---------------------------------------------------------------- chests

  chestAt(p, slot) {
    const c = Number.isInteger(slot) ? p.chests[slot] : null;
    if (!c) fail('no-chest', 'Aucun coffre ici.');
    return c;
  }

  unlockChest(p, slot) {
    const c = this.chestAt(p, slot);
    if (c.unlockEndsAt != null) fail('already', 'Ce coffre est déjà en cours de déverrouillage.');
    const now = this.now();
    if (p.chests.some((o) => o && o.unlockEndsAt && o.unlockEndsAt > now)) fail('busy', 'Un autre coffre est déjà en cours de déverrouillage.');
    c.unlockEndsAt = now + CHESTS[c.type].unlock * 1000;
    this.db.save();
  }

  openChest(p, slot, rng = createRng(this.now() ^ hash(p.id))) {
    const c = this.chestAt(p, slot);
    const now = this.now();
    const secsLeft = c.unlockEndsAt == null ? CHESTS[c.type].unlock : Math.ceil(Math.max(0, c.unlockEndsAt - now) / 1000);
    if (secsLeft > 0) {
      const cost = eco.speedUpCost(secsLeft);
      if (p.gems < cost) fail('gems', 'Pas assez de gemmes.');
      p.gems -= cost;
    }
    p.chests[slot] = null;
    const res = this.openChestContents(p, c.type, c.arena, rng);
    this.db.save();
    return res;
  }

  openFreeChest(p, rng = createRng(this.now() ^ hash(p.id))) {
    this.refreshFreeChest(p);
    if (p.freeChest.stock <= 0) fail('not-ready', 'Pas encore de coffre gratuit.');
    p.freeChest.stock--;
    if (!p.freeChest.nextAt) p.freeChest.nextAt = this.now() + FREE_CHEST_INTERVAL;
    const res = this.openChestContents(p, 'wooden', this.arena(p), rng);
    this.db.save();
    return res;
  }

  openCrownChest(p, rng = createRng(this.now() ^ hash(p.id))) {
    const today = this.dayKey();
    if (p.crownChest.claimedDay === today) fail('claimed', 'Coffre de couronnes déjà ouvert aujourd\'hui.');
    if (p.crownChest.crowns < CROWN_CHEST_CROWNS) fail('crowns', `Il faut ${CROWN_CHEST_CROWNS} couronnes.`);
    p.crownChest = { crowns: 0, claimedDay: today };
    const res = this.openChestContents(p, 'crown', this.arena(p), rng);
    this.db.save();
    return res;
  }

  // ---------------------------------------------------------------- trophy road

  claimRoad(p, index, rng = createRng(this.now() ^ hash(p.id))) {
    const m = TROPHY_ROAD[index];
    if (!m) fail('bad-index', 'Palier inconnu.');
    if (p.bestTrophies < m.trophies) fail('locked', 'Palier pas encore atteint.');
    if (p.roadClaimed.includes(index)) fail('claimed', 'Récompense déjà récupérée.');
    p.roadClaimed.push(index);
    const res = this.applyReward(p, m.reward, rng);
    this.db.save();
    return res;
  }

  // ---------------------------------------------------------------- shop

  buy(p, offerId, rng = createRng(this.now() ^ hash(p.id))) {
    const shop = this.ensureShop(p);
    const id = String(offerId);
    if (id === 'gift') {
      if (shop.gift) fail('claimed', 'Cadeau déjà récupéré aujourd\'hui.');
      shop.gift = true;
      const g = this.staticShop(p).giftReward;
      const res = { kind: 'loot', ...this.grant(p, { gold: g.gold, gems: g.gems }) };
      this.db.save();
      return res;
    }
    const daily = this.shopOffers(p).find((o) => o.id === id);
    if (daily) {
      if (shop.bought.includes(id)) fail('sold-out', 'Offre déjà achetée.');
      if (p.gold < daily.price) fail('gold', "Pas assez d'or.");
      p.gold -= daily.price;
      shop.bought.push(id);
      const res = { kind: 'loot', ...this.grant(p, { cards: [{ id: daily.card, count: daily.count }] }) };
      this.db.save();
      return res;
    }
    const st = this.staticShop(p);
    const chest = st.chests.find((o) => o.id === id);
    if (chest) {
      if (p.gems < chest.gems) fail('gems', 'Pas assez de gemmes.');
      p.gems -= chest.gems;
      const res = this.openChestContents(p, chest.chest, this.arena(p), rng);
      this.db.save();
      return res;
    }
    const pack = st.gold.find((o) => o.id === id);
    if (pack) {
      if (p.gems < pack.gems) fail('gems', 'Pas assez de gemmes.');
      p.gems -= pack.gems;
      const res = { kind: 'loot', ...this.grant(p, { gold: pack.gold }) };
      this.db.save();
      return res;
    }
    fail('bad-offer', 'Offre inconnue.');
    return null;
  }

  // ---------------------------------------------------------------- battle pass

  buyPass(p) {
    const pass = this.ensurePass(p);
    if (pass.premium) fail('owned', 'Tu as déjà le Pass Royal.');
    if (p.gems < PASS.premiumPrice) fail('gems', 'Pas assez de gemmes.');
    p.gems -= PASS.premiumPrice;
    pass.premium = true;
    this.db.save();
  }

  claimPass(p, tier, track, rng = createRng(this.now() ^ hash(p.id))) {
    const pass = this.ensurePass(p);
    if (!Number.isInteger(tier) || tier < 1 || tier > PASS.tiers) fail('bad-tier', 'Palier inconnu.');
    if (tier > this.passTier(p)) fail('locked', 'Palier pas encore atteint.');
    const premium = track === 'premium';
    if (premium && !pass.premium) fail('premium', 'Réservé au Pass Royal.');
    const list = premium ? pass.premiumClaimed : pass.free;
    if (list.includes(tier)) fail('claimed', 'Déjà récupéré.');
    list.push(tier);
    const reward = (premium ? PASS_REWARDS.premium : PASS_REWARDS.free)[tier - 1];
    const res = this.applyReward(p, reward, rng);
    this.db.save();
    return res;
  }

  // ---------------------------------------------------------------- quests

  claimQuest(p, qid) {
    const q = this.ensureQuests(p).list.find((x) => x.id === qid);
    if (!q) fail('bad-quest', 'Quête inconnue.');
    if (q.claimed) fail('claimed', 'Déjà récupéré.');
    if (q.progress < q.n) fail('incomplete', 'Quête pas encore terminée.');
    q.claimed = true;
    this.ensurePass(p).xp += q.xp;
    const res = { kind: 'loot', passXp: q.xp, ...this.grant(p, { gold: q.gold }) };
    this.db.save();
    return res;
  }

  rerollQuest(p, qid) {
    const qs = this.ensureQuests(p);
    if (qs.rerolled) fail('rerolled', 'Une seule nouvelle quête par jour.');
    const i = qs.list.findIndex((x) => x.id === qid);
    if (i < 0) fail('bad-quest', 'Quête inconnue.');
    if (qs.list[i].claimed) fail('claimed', 'Quête déjà terminée.');
    const rng = this.rngFor(`${p.id}:reroll:${qs.day}`);
    const used = new Set(qs.list.map((x) => x.type));
    const types = Object.keys(QUEST_TYPES).filter((t) => !used.has(t) && (!QUEST_TYPES[t].clanOnly || p.clanId));
    qs.list[i] = this.makeQuest(p, rng.pick(types), qs.nextId++, rng);
    qs.rerolled = true;
    this.db.save();
  }

  progressQuests(p, stats) {
    const qs = this.ensureQuests(p);
    const done = [];
    for (const q of qs.list) {
      if (q.claimed || q.progress >= q.n) continue;
      let inc = 0;
      switch (q.type) {
        case 'win': inc = stats.win ? 1 : 0; break;
        case 'battles': inc = stats.battle ? 1 : 0; break;
        case 'cards': inc = stats.cards || 0; break;
        case 'towers': inc = stats.towers || 0; break;
        case 'crowns': inc = stats.crowns || 0; break;
        case 'spell': inc = Math.round(stats.spellDamage || 0); break;
        case 'card': inc = (stats.cardPlays && stats.cardPlays[q.card]) || 0; break;
        case 'three': inc = stats.win && stats.crowns === 3 ? 1 : 0; break;
        case 'donate': inc = stats.donations || 0; break;
        default: break;
      }
      if (!inc) continue;
      q.progress = Math.min(q.n, q.progress + inc);
      if (q.progress >= q.n) done.push(q.id);
    }
    return done;
  }

  // ---------------------------------------------------------------- battles

  /** Everything the match needs about the human player. */
  battleSetup(p) {
    const deck = p.decks[p.activeDeck].filter((id) => p.cards[id]);
    const valid = deck.length === 8 ? deck : DEFAULT_DECK;
    const levels = {};
    for (const id of valid) levels[id] = p.cards[id] ? p.cards[id].level : 1;
    return { deck: valid, levels, towerLevel: clampLevel(this.kingLevel(p)) };
  }

  /** Build a ladder opponent whose deck, levels and skill scale with the player's trophies. */
  ladderOpponent(p, rng) {
    const t = Math.max(0, p.trophies + rng.int(-40, 40));
    const arena = arenaFor(t);
    const pool = new Set(PLAYABLE.filter((id) => CARDS[id].arena <= arena));
    const candidates = AI_ARCHETYPES.map((deck) => ({ deck, fit: deck.filter((id) => pool.has(id)).length }))
      .sort((a, b) => b.fit - a.fit);
    const bestFit = candidates[0].fit;
    const base = rng.pick(candidates.filter((c) => c.fit >= bestFit - 1)).deck;
    const deck = base.filter((id) => pool.has(id));
    const spare = rng.shuffle([...pool].filter((id) => !deck.includes(id)));
    while (deck.length < 8) deck.push(spare.shift());
    // Levels grow with trophies, but never more than ~1 level above the player's own deck:
    // climbing is harder and harder, yet upgrading always pays off (no hard wall).
    const mine = this.battleSetup(p);
    const myAvg = Object.values(mine.levels).reduce((x, y) => x + y, 0) / 8;
    const baseLevel = Math.min(1 + t / 550, myAvg + 0.7);
    const levels = {};
    for (const id of deck) levels[id] = clampLevel(Math.round(baseLevel + rng.range(-0.6, 0.4)));
    const towerLevel = clampLevel(Math.min(Math.round(baseLevel - 0.2), mine.towerLevel + 1));
    return { deck, levels, towerLevel, trophies: t, name: rng.pick(AI_NAMES), level: towerLevel };
  }

  /**
   * Apply the result of a ladder battle.
   * @param r { win, draw, crowns, towers, cards, cardPlays, spellDamage }
   */
  applyBattle(p, r, rng = createRng(this.now() ^ hash(p.id))) {
    const arenaBefore = this.arena(p);
    let delta = 0;
    if (r.win) delta = eco.TROPHIES.win + rng.int(-2, 2);
    else if (!r.draw) delta = Math.max(eco.TROPHIES.loss + rng.int(-2, 2), ARENAS[arenaBefore].trophies - p.trophies);
    p.trophies = Math.max(0, p.trophies + delta);
    p.bestTrophies = Math.max(p.bestTrophies, p.trophies);
    const arenaAfter = this.arena(p);

    const gold = eco.battleGold(arenaBefore, r.win);
    p.gold += gold;

    let chest = null;
    let slotsFull = false;
    if (r.win) {
      const slot = p.chests.findIndex((c) => !c);
      if (slot >= 0) {
        chest = CHEST_CYCLE[p.chestCycle % CHEST_CYCLE.length];
        p.chestCycle++;
        p.chests[slot] = { id: p.nextChestId++, type: chest, arena: arenaBefore, unlockEndsAt: null };
      } else {
        slotsFull = true;
      }
    }

    let crownsToChest = 0;
    if (p.crownChest.claimedDay !== this.dayKey()) {
      crownsToChest = Math.min(CROWN_CHEST_CROWNS - p.crownChest.crowns, r.crowns);
      p.crownChest.crowns += crownsToChest;
    }

    const passXp = battlePassXp(r.crowns, r.win);
    this.ensurePass(p).xp += passXp;
    const questsDone = this.progressQuests(p, { ...r, battle: true });

    p.stats.battles++;
    if (r.win) p.stats.wins++;
    else if (r.draw) p.stats.draws++;
    else p.stats.losses++;
    if (r.win && r.crowns === 3) p.stats.threeCrowns++;

    this.db.save();
    return {
      trophies: delta,
      totalTrophies: p.trophies,
      gold,
      chest,
      slotsFull,
      crowns: r.crowns,
      crownsToChest,
      passXp,
      questsDone,
      newArena: arenaAfter > arenaBefore ? arenaAfter : null,
    };
  }
}

module.exports = { MetaService, MetaError, hash, AI_ARCHETYPES, CHEST_SLOTS, DECK_SLOTS, FREE_CHEST_INTERVAL, CROWN_CHEST_CROWNS, MAX_LEVEL };

};

// Pointer / keyboard input: drag a card onto the arena, or click a card then click the arena.

   * @param canvas

    this.downAt = null;

    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('keydown', (e) => this.key(e));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  reset() {
    this.selection = { slot: null, world: null, dragging: false, valid: false };
  }

  worldOf(e) {
    const rect = this.canvas.getBoundingClientRect();
    return this.renderer.toWorld(e.clientX - rect.left, e.clientY - rect.top);
  }

      const r = cardRect(i);

    return null;

    this.onSelect?.(slot);
  }

    if (!this.enabled) return;
    const w = this.worldOf(e);
    this.selection.world = w;
    const slot = this.slotAt(w);
    if (slot != null) {
      this.downSlot = slot;
      this.wasSelected = this.selection.slot === slot;
      this.select(slot);
      this.selection.dragging = true;
      this.downAt = w;
      return;
    }
    if (this.selection.slot != null && w.y < ARENA_H && w.y >= 0) {
      this.onPlay(this.selection.slot, w.x, w.y);
    }
  }

    if (!this.enabled) return;
    this.selection.world = this.worldOf(e);
  }

    if (!this.enabled || !this.selection.dragging) return;
    const w = this.worldOf(e);
    this.selection.world = w;

'use strict';

// Client-side state for the meta game + request/response helper over the WebSocket.

class Store {
  constructor() {
    this.config = null;
    this.profile = null;
    this.clan = null;
    this.clanList = null;
    this.leaderboard = null;
    this.timeOffset = 0;        // serverNow - clientNow
    this.listeners = new Map();
    this.pending = new Map();
    this.nextRid = 1;
    this.net = null;
  }

  on(event, fn) {
    if (!this.listeners.has(event)) this.listeners.set(event, new Set());
    this.listeners.get(event).add(fn);
    return () => this.listeners.get(event).delete(fn);
  }

  emit(event, data) {
    for (const fn of this.listeners.get(event) || []) fn(data);
  }

  now() {
    return Date.now() + this.timeOffset;
  }

  setProfile(p) {
    this.profile = p;
    this.timeOffset = p.now - Date.now();
    this.emit('profile', p);
  }

  setClan(c) {
    this.clan = c;
    this.emit('clan', c);
  }

  /** Send a meta action; resolves with the result or rejects with the French error message. */
  request(action, params = {}) {
    const rid = this.nextRid++;
    return new Promise((resolve, reject) => {
      this.pending.set(rid, { resolve, reject });
      this.net.send({ t: 'meta', a: action, rid, ...params });
      setTimeout(() => {
        if (this.pending.has(rid)) {
          this.pending.delete(rid);
          reject(new Error('Le serveur ne répond pas.'));
        }
      }, 8000);
    });
  }

  handleReply(msg) {
    const p = this.pending.get(msg.rid);
    if (!p) return;
    this.pending.delete(msg.rid);
    if (msg.ok) p.resolve(msg.result);
    else p.reject(new Error(msg.error || 'Erreur'));
  }

  card(id) {
    return this.config.cards[id];
  }

  /** Copies needed for the next level, or null at max level. */
  nextCost(id) {
    const own = this.profile && this.profile.cards[id];
    const card = this.card(id);
    if (!own || own.level >= this.config.maxLevel) return null;
    return { copies: this.config.rarities[card.rarity].copies[own.level - 1], gold: this.config.upgradeGold[own.level - 1] };
  }

  canUpgrade(id) {
    const c = this.nextCost(id);
    const own = this.profile && this.profile.cards[id];
    return !!(c && own && own.count >= c.copies && this.profile.gold >= c.gold);
  }
}

// Procedural sprites: every unit, tower, projectile and card icon is drawn with Canvas paths.
// All coordinates are in tiles (the caller sets up the world transform).

  { main: '#e8433a', dark: '#9c1f19', light: '#ff9d95', bar: '#ff5a4f' },

const SKIN = '#f6c9a0';
const SKIN_DARK = '#d9a57a';
const STEEL = '#c9d2dc';
const STEEL_DARK = '#7d8896';
const WOOD = '#8a5a2b';
const OUTLINE = 'rgba(20, 16, 30, 0.85)';

function circle(ctx, x, y, r, fill, stroke, lw = 0.05) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
}

function ellipse(ctx, x, y, rx, ry, fill, stroke, lw = 0.05, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.001, rx), Math.max(0.001, ry), rot, 0, Math.PI * 2);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
}

function line(ctx, x1, y1, x2, y2, color, lw, cap = 'round') {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = cap;
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();

    circle(ctx, 0.1 * s, -0.3 * s, 0.07 * s, '#5ff3ff');
  },

  babydragon(ctx, s, c, p, t) {
    const flap = Math.sin(t * 12) * 0.35;
    // wings
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.rotate(flap);
      ctx.beginPath();
      ctx.moveTo(0.2 * s, 0);
      ctx.quadraticCurveTo(1.1 * s, -0.7 * s, 1.0 * s, 0.1 * s);
      ctx.quadraticCurveTo(0.7 * s, 0.0, 0.2 * s, 0.25 * s);
      ctx.fillStyle = c.light;
      ctx.fill();
      ctx.strokeStyle = c.dark;
      ctx.lineWidth = 0.05 * s;
      ctx.stroke();
      ctx.restore();
    }
    ellipse(ctx, 0, 0.15 * s, 0.55 * s, 0.6 * s, '#5cc24a', '#2f7a23', 0.07 * s);
    ellipse(ctx, 0, 0.3 * s, 0.32 * s, 0.35 * s, '#ffcf7a');
    circle(ctx, 0, -0.45 * s, 0.4 * s, '#5cc24a', '#2f7a23', 0.06 * s);
    ellipse(ctx, 0.05 * s, -0.3 * s, 0.22 * s, 0.14 * s, '#8fe27a');
    eyes(ctx, s, -0.55, 0.15, 0.07);
    if (p >= 0 && p < 0.4) circle(ctx, 0.2 * s, -0.25 * s, 0.15 * s, '#ff8a1c');
  },

  valkyrie(ctx, s, c, p) {
    // axe (spins during attack)
    ctx.save();
    const spin = p >= 0 && p <= 1 ? p * Math.PI * 2 : 0;
    ctx.rotate(spin);
    line(ctx, 0.2 * s, 0, 0.95 * s, -0.3 * s, WOOD, 0.1 * s);
    ctx.beginPath();
    ctx.moveTo(0.8 * s, -0.55 * s);
    ctx.quadraticCurveTo(1.25 * s, -0.3 * s, 0.95 * s, 0.0);
    ctx.lineTo(0.85 * s, -0.25 * s);
    ctx.closePath();
    ctx.fillStyle = STEEL;
    ctx.fill();
    ctx.strokeStyle = STEEL_DARK;
    ctx.lineWidth = 0.04 * s;
    ctx.stroke();
    ctx.restore();
    body(ctx, s, c.main, c.dark);
    head(ctx, s);
    ellipse(ctx, 0, -0.62 * s, 0.46 * s, 0.24 * s, '#ff8a1c');
    ellipse(ctx, -0.45 * s, -0.2 * s, 0.12 * s, 0.32 * s, '#ff8a1c');
    ellipse(ctx, 0.45 * s, -0.2 * s, 0.12 * s, 0.32 * s, '#ff8a1c');
    eyes(ctx, s, -0.32);
  },

  hogrider(ctx, s, c, p, t, moving) {
    const bounce = moving ? Math.abs(Math.sin(t * 14)) * 0.08 * s : 0;
    // hog
    ellipse(ctx, 0, 0.35 * s, 0.75 * s, 0.45 * s, '#c47a52', '#7a4428', 0.07 * s);
    ellipse(ctx, 0.72 * s, 0.35 * s, 0.2 * s, 0.17 * s, '#e7a07f', '#7a4428', 0.04 * s);
    circle(ctx, 0.78 * s, 0.32 * s, 0.03 * s, '#5a2a18');
    circle(ctx, 0.78 * s, 0.4 * s, 0.03 * s, '#5a2a18');
    circle(ctx, 0.5 * s, 0.2 * s, 0.05 * s, '#111');
    // rider
    ctx.save();
    ctx.translate(-0.1 * s, -bounce);
    ctx.save();
    ctx.translate(0.3 * s, -0.25 * s);
    ctx.rotate(-0.9 + swing(p));
    line(ctx, 0, 0, 0, -0.8 * s, WOOD, 0.08 * s);
    ellipse(ctx, 0, -0.85 * s, 0.22 * s, 0.13 * s, STEEL_DARK);
    ctx.restore();
    ellipse(ctx, 0, -0.15 * s, 0.4 * s, 0.35 * s, c.main, c.dark, 0.06 * s);
    circle(ctx, 0, -0.62 * s, 0.3 * s, SKIN, OUTLINE, 0.05 * s);
    ellipse(ctx, 0, -0.95 * s, 0.1 * s, 0.18 * s, '#3a2a1a');
    eyes(ctx, s, -0.62, 0.11, 0.05);
    ctx.restore();
  },

  skeletons(ctx, s, c, p) {
    const f = swing(p);
    line(ctx, 0.35 * s, 0.1 * s, (0.75 + f * 0.1) * s, (-0.3 - f * 0.1) * s, '#eee', 0.1 * s);
    ellipse(ctx, 0, 0.25 * s, 0.4 * s, 0.4 * s, c.main, c.dark, 0.08 * s);
    circle(ctx, 0, -0.3 * s, 0.48 * s, '#f4f4ee', '#8a8a80', 0.06 * s);
    circle(ctx, -0.16 * s, -0.32 * s, 0.12 * s, '#222');
    circle(ctx, 0.16 * s, -0.32 * s, 0.12 * s, '#222');
    line(ctx, -0.1 * s, -0.05 * s, 0.1 * s, -0.05 * s, '#444', 0.05 * s);
  },

  minions(ctx, s, c, p, t) {
    const flap = Math.sin(t * 16) * 0.4;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.rotate(flap);
      ctx.beginPath();
      ctx.moveTo(0.25 * s, -0.1 * s);
      ctx.lineTo(1.05 * s, -0.5 * s);
      ctx.lineTo(0.8 * s, 0.1 * s);
      ctx.lineTo(0.25 * s, 0.2 * s);
      ctx.closePath();
      ctx.fillStyle = '#6a7fb0';
      ctx.fill();
      ctx.strokeStyle = '#2a3560';
      ctx.lineWidth = 0.05 * s;
      ctx.stroke();
      ctx.restore();
    }
    ellipse(ctx, 0, 0.1 * s, 0.48 * s, 0.55 * s, c.main, c.dark, 0.07 * s);
    circle(ctx, 0, -0.35 * s, 0.36 * s, '#5b7bd5', '#2a3560', 0.05 * s);
    ctx.fillStyle = '#eee';
    ctx.beginPath();
    ctx.moveTo(-0.25 * s, -0.55 * s);
    ctx.lineTo(-0.38 * s, -0.85 * s);
    ctx.lineTo(-0.1 * s, -0.62 * s);
    ctx.moveTo(0.25 * s, -0.55 * s);
    ctx.lineTo(0.38 * s, -0.85 * s);
    ctx.lineTo(0.1 * s, -0.62 * s);
    ctx.fill();
    eyes(ctx, s, -0.35, 0.13, 0.06);
    if (p >= 0 && p < 0.3) circle(ctx, 0.25 * s, -0.2 * s, 0.12 * s, '#b58cff');
  },

  goblins(ctx, s, c, p) {
    const f = swing(p);
    line(ctx, 0.4 * s, 0.1 * s, (0.8 + f * 0.1) * s, (-0.2 - f * 0.12) * s, STEEL, 0.1 * s);
    body(ctx, s, c.main, c.dark);
    // ears
    ctx.fillStyle = '#6fcf4a';
    ctx.beginPath();
    ctx.moveTo(-0.3 * s, -0.4 * s);
    ctx.lineTo(-0.85 * s, -0.55 * s);
    ctx.lineTo(-0.3 * s, -0.2 * s);
    ctx.moveTo(0.3 * s, -0.4 * s);
    ctx.lineTo(0.85 * s, -0.55 * s);
    ctx.lineTo(0.3 * s, -0.2 * s);
    ctx.fill();
    head(ctx, s, '#6fcf4a', -0.36, 0.4);
    eyes(ctx, s, -0.4, 0.14, 0.07);
    ellipse(ctx, 0, -0.2 * s, 0.1 * s, 0.06 * s, '#3f8a2a');
  },

  wizard(ctx, s, c, p, t) {
    body(ctx, s, c.main, c.dark);
    head(ctx, s);
    ellipse(ctx, 0, -0.62 * s, 0.44 * s, 0.22 * s, '#6b4226');
    ellipse(ctx, 0, -0.1 * s, 0.25 * s, 0.14 * s, '#6b4226');
    eyes(ctx, s, -0.36);
    // fire in hands
    const glow = 0.18 + Math.sin(t * 10) * 0.03 + (p >= 0 && p < 0.4 ? 0.12 : 0);
    circle(ctx, 0.55 * s, 0.05 * s, glow * s, 'rgba(255,140,30,0.9)');
    circle(ctx, 0.55 * s, 0.05 * s, glow * 0.55 * s, '#ffe066');
    circle(ctx, -0.55 * s, 0.05 * s, glow * 0.8 * s, 'rgba(255,140,30,0.9)');
  },

  bomber(ctx, s, c, p) {
    ellipse(ctx, 0, 0.2 * s, 0.5 * s, 0.45 * s, c.main, c.dark, 0.07 * s);
    circle(ctx, 0, -0.3 * s, 0.42 * s, '#f4f4ee', '#8a8a80', 0.06 * s);
    circle(ctx, -0.14 * s, -0.32 * s, 0.1 * s, '#222');
    circle(ctx, 0.14 * s, -0.32 * s, 0.1 * s, '#222');
    const lift = p >= 0 && p <= 1 ? Math.sin(p * Math.PI) * 0.4 : 0;
    circle(ctx, 0.55 * s, (0.05 - lift) * s, 0.28 * s, '#2a2a35', '#000', 0.04 * s);
    line(ctx, 0.62 * s, (-0.2 - lift) * s, 0.72 * s, (-0.35 - lift) * s, '#c9a36a', 0.05 * s);
    circle(ctx, 0.74 * s, (-0.38 - lift) * s, 0.07 * s, '#ffd34d');
  },

  balloon(ctx, s, c, p, t) {
    const bob = Math.sin(t * 3) * 0.06 * s;
    // ropes + basket
    line(ctx, -0.35 * s, 0.2 * s + bob, -0.25 * s, 0.75 * s, '#6b4a2a', 0.04 * s);
    line(ctx, 0.35 * s, 0.2 * s + bob, 0.25 * s, 0.75 * s, '#6b4a2a', 0.04 * s);
    roundRect(ctx, -0.3 * s, 0.7 * s, 0.6 * s, 0.35 * s, 0.08 * s);
    ctx.fillStyle = WOOD;
    ctx.fill();
    circle(ctx, 0, 0.62 * s, 0.14 * s, '#f4f4ee');
    // envelope
    ellipse(ctx, 0, -0.3 * s + bob, 0.78 * s, 0.72 * s, c.main, c.dark, 0.07 * s);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, -0.3 * s + bob, 0.78 * s, 0.72 * s, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = c.light;
    for (let i = -2; i <= 2; i += 2) ctx.fillRect((i * 0.2 - 0.1) * s, -1.1 * s + bob, 0.2 * s, 1.6 * s);
    ctx.restore();
    if (p >= 0 && p < 0.5) circle(ctx, 0, (1.2 + p) * s, 0.2 * s, '#2a2a35');
  },

  cannon(ctx, s, c, p, t, moving, facing) {
    roundRect(ctx, -0.8 * s, -0.8 * s, 1.6 * s, 1.6 * s, 0.25 * s);
    ctx.fillStyle = '#9b6b3a';
    ctx.fill();
    ctx.strokeStyle = c.main;
    ctx.lineWidth = 0.12 * s;
    ctx.stroke();
    circle(ctx, 0, 0, 0.5 * s, '#6d4a28');
    ctx.save();
    ctx.rotate(facing);
    const kick = p >= 0 && p <= 1 ? Math.max(0, 1 - p * 3) * 0.2 : 0;
    roundRect(ctx, (-0.2 - kick) * s, -0.22 * s, 1.0 * s, 0.44 * s, 0.1 * s);
    ctx.fillStyle = '#2d2d36';
    ctx.fill();
    circle(ctx, 0, 0, 0.32 * s, '#3c3c48');
    if (kick > 0.1) circle(ctx, 1.0 * s, 0, 0.2 * s, '#ffd34d');
    ctx.restore();
  },
  witch(ctx, s, c, p, t) {
    // staff with a glowing skull
    line(ctx, 0.5 * s, 0.5 * s, 0.6 * s, -0.7 * s, WOOD, 0.08 * s);
    const glow = 0.15 + (p >= 0 && p < 0.4 ? 0.08 : 0) + Math.sin(t * 6) * 0.02;
    circle(ctx, 0.6 * s, -0.8 * s, glow * s, 'rgba(190,120,255,0.8)');
    circle(ctx, 0.6 * s, -0.8 * s, 0.09 * s, '#f4f4ee');
    body(ctx, s, c.main, c.dark);
    head(ctx, s, '#f0c8b0');
    ellipse(ctx, 0, -0.35 * s, 0.5 * s, 0.25 * s, '#6a3fa8');
    // pointy hood
    ctx.beginPath();
    ctx.moveTo(-0.45 * s, -0.45 * s);
    ctx.quadraticCurveTo(0, -1.3 * s, 0.35 * s, -1.05 * s);
    ctx.quadraticCurveTo(0.3 * s, -0.6 * s, 0.45 * s, -0.45 * s);
    ctx.closePath();
    ctx.fillStyle = '#4a2a80';
    ctx.fill();
    eyes(ctx, s, -0.3);
  },

  prince(ctx, s, c, p, t, moving) {
    // horse
    ellipse(ctx, 0, 0.35 * s, 0.8 * s, 0.42 * s, '#f2efe8', '#8a8478', 0.06 * s);
    ellipse(ctx, 0.8 * s, 0.1 * s, 0.25 * s, 0.2 * s, '#f2efe8', '#8a8478', 0.05 * s);
    ellipse(ctx, 0.1 * s, 0.35 * s, 0.45 * s, 0.3 * s, c.main);
    const bounce = moving ? Math.abs(Math.sin(t * 12)) * 0.07 * s : 0;
    ctx.save();
    ctx.translate(-0.05 * s, -bounce);
    // lance
    const thrust = p >= 0 && p <= 1 ? Math.sin(p * Math.PI) * 0.3 : 0;
    line(ctx, (0.1 + thrust) * s, -0.3 * s, (1.3 + thrust) * s, -0.45 * s, '#d8c089', 0.1 * s);
    ctx.beginPath();
    ctx.moveTo((1.3 + thrust) * s, -0.55 * s);
    ctx.lineTo((1.55 + thrust) * s, -0.46 * s);
    ctx.lineTo((1.3 + thrust) * s, -0.35 * s);
    ctx.fillStyle = STEEL;
    ctx.fill();
    ellipse(ctx, 0, -0.2 * s, 0.38 * s, 0.35 * s, c.main, c.dark, 0.06 * s);
    circle(ctx, 0, -0.65 * s, 0.3 * s, SKIN, OUTLINE, 0.05 * s);
    ctx.beginPath();
    ctx.arc(0, -0.7 * s, 0.32 * s, Math.PI, 0);
    ctx.fillStyle = '#ffd34d';
    ctx.fill();
    line(ctx, 0, -1.02 * s, 0, -1.2 * s, '#e8433a', 0.08 * s);
    eyes(ctx, s, -0.63, 0.11, 0.05);
    ctx.restore();
  },

  pekka(ctx, s, c, p) {
    ctx.save();
    ctx.translate(0.55 * s, 0.1 * s);
    ctx.rotate(-0.5 + swing(p));
    line(ctx, 0, 0, 0, -1.25 * s, '#cfd8e2', 0.26 * s, 'butt');
    ctx.beginPath();
    ctx.moveTo(-0.13 * s, -1.25 * s);
    ctx.lineTo(0, -1.45 * s);
    ctx.lineTo(0.13 * s, -1.25 * s);
    ctx.fillStyle = '#cfd8e2';
    ctx.fill();
    line(ctx, -0.25 * s, 0, 0.25 * s, 0, '#444', 0.12 * s);
    ctx.restore();
    ellipse(ctx, 0, 0.18 * s, 0.68 * s, 0.6 * s, '#2a3550', c.main, 0.14 * s);
    circle(ctx, 0, -0.35 * s, 0.5 * s, '#33405e', OUTLINE, 0.05 * s);
    // big curved horns
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 0.3 * s, -0.7 * s);
      ctx.quadraticCurveTo(side * 0.9 * s, -1.0 * s, side * 0.55 * s, -1.25 * s);
      ctx.quadraticCurveTo(side * 0.6 * s, -0.95 * s, side * 0.15 * s, -0.78 * s);
      ctx.fillStyle = '#e0dcd0';
      ctx.fill();
    }
    ellipse(ctx, 0, -0.32 * s, 0.34 * s, 0.1 * s, '#0b0b14');
    circle(ctx, 0.12 * s, -0.32 * s, 0.08 * s, '#ff4df0');
  },

  golem(ctx, s, c, p) {
    const f = swing(p);
    for (const side of [-1, 1]) circle(ctx, side * (0.72 + (side > 0 ? f * 0.1 : 0)) * s, (0.1 - (side > 0 ? f * 0.15 : 0)) * s, 0.3 * s, '#8c8a86', '#4a4844', 0.05 * s);
    ellipse(ctx, 0, 0.12 * s, 0.75 * s, 0.68 * s, '#9a9892', '#4a4844', 0.07 * s);
    ellipse(ctx, 0, 0.2 * s, 0.35 * s, 0.25 * s, c.main);
    circle(ctx, 0, -0.45 * s, 0.35 * s, '#a8a6a0', '#4a4844', 0.05 * s);
    circle(ctx, -0.12 * s, -0.48 * s, 0.06 * s, '#6af0ff');
    circle(ctx, 0.12 * s, -0.48 * s, 0.06 * s, '#6af0ff');
    // cracks
    line(ctx, -0.4 * s, -0.05 * s, -0.2 * s, 0.25 * s, '#5a5854', 0.04 * s);
    line(ctx, 0.35 * s, 0.35 * s, 0.5 * s, 0.05 * s, '#5a5854', 0.04 * s);
  },

  golemite(ctx, s, c, p) {
    const f = swing(p);
    circle(ctx, (0.6 + f * 0.1) * s, (0.1 - f * 0.15) * s, 0.22 * s, '#8c8a86', '#4a4844', 0.05 * s);
    ellipse(ctx, 0, 0.12 * s, 0.62 * s, 0.58 * s, '#9a9892', '#4a4844', 0.07 * s);
    ellipse(ctx, 0, 0.2 * s, 0.25 * s, 0.2 * s, c.main);
    circle(ctx, -0.12 * s, -0.25 * s, 0.07 * s, '#6af0ff');
    circle(ctx, 0.12 * s, -0.25 * s, 0.07 * s, '#6af0ff');
  },

  megaminion(ctx, s, c, p, t) {
    const flap = Math.sin(t * 10) * 0.35;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.rotate(flap);
      ctx.beginPath();
      ctx.moveTo(0.3 * s, -0.1 * s);
      ctx.lineTo(1.15 * s, -0.6 * s);
      ctx.lineTo(0.95 * s, 0.15 * s);
      ctx.lineTo(0.3 * s, 0.25 * s);
      ctx.closePath();
      ctx.fillStyle = '#5a6a98';
      ctx.fill();
      ctx.strokeStyle = '#26305a';
      ctx.lineWidth = 0.05 * s;
      ctx.stroke();
      ctx.restore();
    }
    ellipse(ctx, 0, 0.12 * s, 0.55 * s, 0.6 * s, c.main, c.dark, 0.07 * s);
    // armour helmet
    circle(ctx, 0, -0.38 * s, 0.4 * s, '#8f99ad', '#3a4254', 0.06 * s);
    ellipse(ctx, 0, -0.36 * s, 0.25 * s, 0.07 * s, '#1b1b2a');
    circle(ctx, 0.08 * s, -0.36 * s, 0.05 * s, '#ffd34d');
    if (p >= 0 && p < 0.3) circle(ctx, 0.3 * s, -0.1 * s, 0.14 * s, '#b58cff');
  },

  princess(ctx, s, c, p) {
    body(ctx, s, c.main, c.dark);
    head(ctx, s);
    ctx.beginPath();
    ctx.arc(0, -0.45 * s, 0.45 * s, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fillStyle = '#ffd34d';
    ctx.fill();
    ellipse(ctx, -0.45 * s, -0.1 * s, 0.13 * s, 0.35 * s, '#ffd34d');
    ellipse(ctx, 0.45 * s, -0.1 * s, 0.13 * s, 0.35 * s, '#ffd34d');
    // tiara
    ctx.beginPath();
    ctx.moveTo(-0.22 * s, -0.8 * s);
    ctx.lineTo(-0.1 * s, -1.0 * s);
    ctx.lineTo(0, -0.84 * s);
    ctx.lineTo(0.1 * s, -1.0 * s);
    ctx.lineTo(0.22 * s, -0.8 * s);
    ctx.fillStyle = '#ff9dff';
    ctx.fill();
    eyes(ctx, s, -0.32);
    const pull = p >= 0 && p <= 1 ? Math.sin(p * Math.PI) * 0.15 : 0;
    ctx.beginPath();
    ctx.arc(0.45 * s, 0.05 * s, 0.5 * s, -1.2, 1.2);
    ctx.strokeStyle = '#d8b24a';
    ctx.lineWidth = 0.09 * s;
    ctx.stroke();
    line(ctx, 0.63 * s, -0.42 * s, (0.4 - pull) * s, 0.05 * s, '#eee', 0.03 * s);
    line(ctx, (0.4 - pull) * s, 0.05 * s, 0.63 * s, 0.52 * s, '#eee', 0.03 * s);
    if (p >= 0 && p < 0.3) circle(ctx, 0.5 * s, 0.05 * s, 0.1 * s, '#ff8a1c');
  },

  miner(ctx, s, c, p) {
    const f = swing(p);
    ctx.save();
    ctx.translate(0.45 * s, 0.1 * s);
    ctx.rotate(-0.7 + f);
    line(ctx, 0, 0, 0, -0.8 * s, WOOD, 0.09 * s);
    ctx.beginPath();
    ctx.moveTo(-0.35 * s, -0.7 * s);
    ctx.quadraticCurveTo(0, -0.95 * s, 0.35 * s, -0.7 * s);
    ctx.lineWidth = 0.1 * s;
    ctx.strokeStyle = STEEL_DARK;
    ctx.stroke();
    ctx.restore();
    body(ctx, s, c.main, c.dark);
    head(ctx, s);
    ellipse(ctx, 0, -0.1 * s, 0.3 * s, 0.14 * s, '#8a5a2b');
    // helmet with lamp
    ctx.beginPath();
    ctx.arc(0, -0.45 * s, 0.45 * s, Math.PI, 0);
    ctx.fillStyle = '#e0a526';
    ctx.fill();
    circle(ctx, 0, -0.78 * s, 0.1 * s, '#fff8b0', '#9a6b00', 0.03 * s);
    eyes(ctx, s, -0.32);
  },

  infernotower(ctx, s, c, p, t, moving, facing) {
    roundRect(ctx, -0.8 * s, -0.8 * s, 1.6 * s, 1.6 * s, 0.3 * s);
    ctx.fillStyle = '#5a5a66';
    ctx.fill();
    ctx.strokeStyle = c.main;
    ctx.lineWidth = 0.12 * s;
    ctx.stroke();
    circle(ctx, 0, 0, 0.55 * s, '#3a3a44');
    // glowing core
    const g = 0.28 + Math.sin(t * 8) * 0.04;
    circle(ctx, 0, 0, g * s * 1.6, 'rgba(255,90,20,0.35)');
    circle(ctx, 0, 0, g * s, '#ff7a1c');
    circle(ctx, 0, 0, g * s * 0.5, '#ffe066');
    ctx.save();
    ctx.rotate(facing);
    roundRect(ctx, 0.2 * s, -0.12 * s, 0.6 * s, 0.24 * s, 0.08 * s);
    ctx.fillStyle = '#2d2d36';
    ctx.fill();
    ctx.restore();
  },
};
DRAW.skeleton = DRAW.skeletons;

/**
 * Draw a troop or building.
 * @param p   attack animation progress 0..1, or -1 when idle
 */
function drawUnit(ctx, card, team, x, y, r, opts = {}) {
  const c = TEAM[team];
  const s = r * 1.3 + 0.1;       // small troops get a little extra size to stay readable
  const t = opts.time || 0;
